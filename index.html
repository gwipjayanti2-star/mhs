<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHS Pro - Smart Operations</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0B1B3D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MHS Pro">
    
    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" href="https://www.image2url.com/r2/default/files/1790301105424-7b6b60f2-4ebe-41f8-a0d1-384221bc41ad.png">
    <link rel="apple-touch-icon" href="https://www.image2url.com/r2/default/files/1790301105424-7b6b60f2-4ebe-41f8-a0d1-384221bc41ad.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Libraries for Export to Image/PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #F4F7F9;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-scale-in {
            animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
        
        .ease-spring {
            transition-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .custom-date-input::-webkit-calendar-picker-indicator {
            background: transparent; bottom: 0; color: transparent; cursor: pointer;
            height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        html, body { overflow-x: hidden; }

        /* Fallback for icon sizing */
        .lucide { display: inline-block; }
    </style>
</head>
<body class="font-sans bg-[#F4F7F9] text-slate-800 selection:bg-blue-200">
    
    <!-- Root Container -->
    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        const API_URL = "https://script.google.com/macros/s/AKfycbxnWOh6-FIn5v_kNalNsIi4QgZoRJ_6htXU_N0AWln2-nUWPTuEuRRwr9mjMCTB6TODdQ/exec";
        const DAYS_OF_WEEK = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
        const SILO_MERK_OPTIONS = {
            soft: ['B7', 'LM', 'MILA', 'FALCONILA', 'B7 MKL', 'LAINNYA'],
            medium: ['W3', 'LAINNYA']
        };

        const getWeekNumber = (date) => {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        };

        const getCurrentShiftInfo = () => {
            const now = new Date();
            const hours = now.getHours();
            let shift = '1';
            let date = new Date(now);
            if (hours >= 7 && hours < 15) { shift = '1'; } 
            else if (hours >= 15 && hours < 23) { shift = '2'; } 
            else { shift = '3'; if (hours < 7) { date.setDate(date.getDate() - 1); } }
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return { shift, date: `${year}-${month}-${day}` };
        };

        const getDayName = (dateStr) => {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleDateString('id-ID', { weekday: 'long' });
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        };

        const formatDateToYYYYMMDD = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const formatTime = (timeStr) => {
            if (!timeStr || timeStr === '-') return '-';
            if (typeof timeStr === 'string') {
                if (/^\d{2}:\d{2}$/.test(timeStr)) return timeStr;
                if (/^\d{2}:\d{2}:\d{2}/.test(timeStr)) return timeStr.substring(0, 5);
            }
            try {
                const d = new Date(timeStr);
                if (!isNaN(d.getTime())) return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
            } catch (e) {}
            return String(timeStr);
        };

        const calcPakai = (awal, totalMasuk, akhir) => {
            if (akhir === '' || akhir === null || akhir === undefined) return 0;
            const p = (Number(awal) || 0) + (Number(totalMasuk) || 0) - (Number(akhir) || 0);
            return p > 0 ? p : 0;
        };

        const app = {
            state: {
                user: null, 
                activeTab: 'dashboard',
                isAuthLoading: false,
                loginError: '',
                globalMessage: null,
                isSyncing: false,
                db: { lastStock: null, opnameLogs: [], bulkyLogs: [], maintenanceLogs: [] },
                stockForm: null,
                recapFilters: { week: 'all', day: 'all', searchOpen: false, searchTxt: '' },
                selectedOpnameForBulky: null, 
                bulkyFilters: { week: getWeekNumber(new Date()).toString(), day: 'all', searchOpen: false, searchTxt: '' },
                bulkyForm: null,
                maintenanceForm: null,
                selectedMerkRecap: null 
            },

            render: function() {
                const root = document.getElementById('root');
                if (!this.state.user) {
                    root.innerHTML = Components.LoginScreen();
                } else {
                    root.innerHTML = Components.Layout();
                    this.renderActiveTab();
                    this.updateNavIndicator();
                }
                this.renderGlobalMessage();
                lucide.createIcons();
            },

            renderActiveTab: function() {
                const container = document.getElementById('main-content');
                if (!container) return;
                
                let content = '';
                switch (this.state.activeTab) {
                    case 'dashboard': content = Views.Dashboard(); break;
                    case 'stock': content = Views.StockForm(); break;
                    case 'recap': content = Views.OpnameRecap(); break;
                    case 'bulky': content = Views.BulkyForm(); break;
                    case 'maintenance': content = Views.MaintenanceForm(); break;
                }
                container.innerHTML = content;
                lucide.createIcons();
            },

            switchTab: function(tabId) {
                if(this.state.activeTab === tabId) return;
                this.state.activeTab = tabId;
                this.renderActiveTab();
                this.updateNavIndicator();
                
                document.querySelectorAll('.nav-item').forEach(el => {
                    const id = el.dataset.id;
                    const iconContainer = el.querySelector('.icon-container');
                    const label = el.querySelector('.nav-label');
                    const icon = el.querySelector('svg') || el.querySelector('i');
                    
                    if (id === tabId) {
                        iconContainer.className = 'icon-container transition-all duration-300 text-blue-600 transform -translate-y-1 drop-shadow-sm';
                        label.className = 'nav-label text-[9px] sm:text-[10px] mt-1 transition-all duration-300 font-black text-blue-700';
                        if (icon) { icon.style.width = '24px'; icon.style.height = '24px'; }
                    } else {
                        iconContainer.className = 'icon-container transition-all duration-300 text-slate-400 group-hover:text-slate-600 group-hover:-translate-y-0.5';
                        label.className = 'nav-label text-[9px] sm:text-[10px] mt-1 transition-all duration-300 font-bold text-slate-400';
                        if (icon) { icon.style.width = '22px'; icon.style.height = '22px'; }
                    }
                });
            },

            updateNavIndicator: function() {
                const indicator = document.getElementById('nav-indicator');
                if (!indicator) return;
                let tabs = ['dashboard', 'stock', 'recap', 'bulky', 'maintenance'];
                if (this.state.user?.role === 'viewer') tabs = ['dashboard', 'recap', 'bulky', 'maintenance'];
                const activeIndex = tabs.indexOf(this.state.activeTab);
                const tabWidthPercentage = 100 / tabs.length;
                indicator.style.left = `calc(${activeIndex * tabWidthPercentage}% + 8px)`;
                indicator.style.width = `calc(${tabWidthPercentage}% - 16px)`;
            },

            showGlobalMessage: function(msg, isError = true) {
                this.state.globalMessage = { text: msg, isError };
                this.renderGlobalMessage();
                setTimeout(() => { this.state.globalMessage = null; this.renderGlobalMessage(); }, 3500);
            },

            renderGlobalMessage: function() {
                let existing = document.getElementById('global-message');
                if (existing) existing.remove();
                if (this.state.globalMessage) {
                    const msg = this.state.globalMessage;
                    const div = document.createElement('div');
                    div.id = 'global-message';
                    div.className = `fixed top-6 left-1/2 transform -translate-x-1/2 ${msg.isError ? 'bg-rose-900/95 border-rose-700/50 text-white' : 'bg-slate-900/95 border-slate-700/50 text-white'} backdrop-blur-md px-4 py-3 sm:px-6 sm:py-4 rounded-full shadow-2xl text-xs sm:text-sm font-bold flex items-center z-[100] border animate-fade-in whitespace-nowrap`;
                    const iconColor = msg.isError ? 'text-rose-400' : 'text-emerald-400';
                    const iconName = msg.isError ? 'alert-circle' : 'check-circle-2';
                    div.innerHTML = `<i data-lucide="${iconName}" class="mr-2 sm:mr-3 ${iconColor}" style="width: 18px; height: 18px;"></i> ${msg.text}`;
                    document.body.appendChild(div);
                    lucide.createIcons({root: div});
                }
            },

            showSuccessModal: function(title, message) {
                let existing = document.getElementById('success-modal');
                if (existing) existing.remove();
                const div = document.createElement('div');
                div.id = 'success-modal';
                div.className = 'fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm';
                div.innerHTML = `
                    <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl flex flex-col items-center text-center animate-scale-in border border-slate-100">
                        <div class="w-20 h-20 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mb-5 shadow-inner border border-emerald-200">
                            <i data-lucide="check-circle" stroke-width="2.5" style="width: 40px; height: 40px;"></i>
                        </div>
                        <h3 class="text-2xl font-black text-slate-800 mb-2">${title}</h3>
                        <p class="text-sm font-semibold text-slate-500 mb-6">${message}</p>
                        <button onclick="document.getElementById('success-modal').remove()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-black py-4 rounded-2xl transition-colors shadow-lg shadow-emerald-500/30 active:scale-95 text-sm uppercase tracking-widest">Selesai</button>
                    </div>`;
                document.body.appendChild(div);
                lucide.createIcons({root: div});
                setTimeout(() => { const el = document.getElementById('success-modal'); if(el) el.remove(); }, 3500);
            },

            login: async function(e) {
                e.preventDefault();
                const username = document.getElementById('login-username').value;
                const password = document.getElementById('login-password').value;
                this.state.loginError = '';
                
                this.state.isAuthLoading = true;
                this.render(); 
                
                try {
                    const res = await fetch(`${API_URL}?action=login&username=${username}&password=${password}`);
                    const data = await res.json();
                    if (data.success) {
                        this.state.user = { username: data.username, role: data.role };
                        this.fetchData();
                        this.render();
                    } else {
                        this.state.loginError = "Login Gagal: Username atau Password salah.";
                    }
                } catch (err) {
                    this.state.loginError = "Koneksi ditolak server (CORS/Network Error). Pastikan API_URL valid.";
                }
                this.state.isAuthLoading = false;
                if(!this.state.user) this.render();
            },

            logout: function() { this.state.user = null; this.render(); },

            fetchData: async function() {
                this.state.isSyncing = true;
                this.updateSyncUI(true);
                try {
                    const res = await fetch(`${API_URL}?action=getData`);
                    const data = await res.json();
                    this.state.db = data;
                    if(['dashboard', 'recap', 'maintenance', 'bulky'].includes(this.state.activeTab)) {
                         this.renderActiveTab();
                    }
                } catch (err) {
                    this.showGlobalMessage("Gagal sinkronisasi data.");
                }
                this.state.isSyncing = false;
                this.updateSyncUI(false);
            },

            updateSyncUI: function(isSyncing) {
                const btn = document.getElementById('sync-btn');
                const icon = document.getElementById('sync-icon');
                const text = document.getElementById('sync-text');
                if(!btn) return;
                
                if (isSyncing) {
                    btn.disabled = true; btn.classList.add('opacity-70', 'cursor-wait');
                    icon.classList.add('animate-spin'); icon.classList.remove('group-hover:rotate-180', 'transition-transform', 'duration-700');
                    if(text) text.innerText = 'Syncing';
                } else {
                    btn.disabled = false; btn.classList.remove('opacity-70', 'cursor-wait');
                    icon.classList.remove('animate-spin'); icon.classList.add('group-hover:rotate-180', 'transition-transform', 'duration-700');
                    if(text) text.innerText = 'Sync';
                }
            },

            postData: async function(payloadData) {
                try {
                    if(payloadData.action === 'saveOpname') {
                        this.state.db.lastStock = { ...this.state.db.lastStock, ...payloadData.payload.stock };
                        this.state.db.opnameLogs = [payloadData.payload.log, ...(this.state.db.opnameLogs || [])];
                    } else if (payloadData.action === 'saveBulky') {
                        this.state.db.bulkyLogs = [payloadData.payload, ...(this.state.db.bulkyLogs || [])];
                        if(this.state.activeTab === 'bulky') this.renderActiveTab();
                    } else if (payloadData.action === 'saveMaintenance') {
                        this.state.db.maintenanceLogs = [payloadData.payload, ...(this.state.db.maintenanceLogs || [])];
                        if(this.state.activeTab === 'maintenance') this.renderActiveTab();
                    }

                    const params = new URLSearchParams();
                    params.append('action', payloadData.action);
                    
                    const flatten = (obj, prefix = '') => {
                        for (const key in obj) {
                            if (Object.prototype.hasOwnProperty.call(obj, key)) {
                                const val = obj[key];
                                const newKey = prefix ? `${prefix}_${key}` : key;
                                if (val !== null && typeof val === 'object') {
                                    if (Array.isArray(val) && (val.length === 0 || typeof val[0] !== 'object')) {
                                        params.append(newKey, val.filter(v => v !== null && String(v).trim() !== '').join(' | '));
                                    } else {
                                        flatten(val, newKey);
                                    }
                                } else {
                                    params.append(newKey, val !== undefined && val !== null ? val : '');
                                }
                            }
                        }
                    };
                    if (payloadData.payload) flatten(payloadData.payload);
                    await fetch(API_URL, { method: 'POST', body: params });
                } catch (err) {
                    this.showGlobalMessage("Gagal menyimpan data ke server.");
                }
            }
        };

        const Components = {
            Card: (content, className = '', padding = 'p-5') => {
                const overflowClass = className.includes('overflow-') ? '' : 'overflow-hidden';
                return `<div class="bg-white/90 backdrop-blur-sm rounded-[1.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-200/60 transition-all duration-300 hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] ${overflowClass} ${padding} ${className}">${content}</div>`;
            },
            
            Badge: (content, variant = 'primary') => {
                const variants = {
                    primary: 'bg-blue-50 text-blue-700 border border-blue-100',
                    success: 'bg-emerald-50 text-emerald-700 border border-emerald-100',
                    warning: 'bg-amber-50 text-amber-700 border border-amber-100',
                    danger: 'bg-rose-50 text-rose-700 border border-rose-100',
                    slate: 'bg-slate-100 text-slate-600 border border-slate-200',
                };
                return `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider border ${variants[variant]}">${content}</span>`;
            },

            FloatingInput: (props) => {
                const { id, label, type = 'text', value = '', placeholder = ' ', min, step, suffix, disabled, required, onInput } = props;
                const disabledClasses = disabled ? 'opacity-70 bg-slate-50 cursor-not-allowed text-slate-500 font-semibold' : '';
                const hasValueClass = value ? 'scale-75 -translate-y-3' : '';
                
                return `
                <div class="relative group w-full mb-4">
                    <input type="${type}" id="${id}" ${value ? `value="${value}"` : ''} placeholder="${placeholder}" ${min ? `min="${min}"` : ''} ${step ? `step="${step}"` : ''} ${required ? 'required' : ''} ${disabled ? 'disabled' : ''} ${onInput ? `oninput="${onInput}"` : ''}
                        class="block w-full px-4 pt-6 pb-2 text-base font-medium text-slate-900 bg-white border border-slate-200 rounded-2xl appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all peer shadow-sm ${disabledClasses}"
                    />
                    <label class="absolute text-[11px] font-bold text-slate-400 uppercase tracking-wider duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3 peer-focus:text-blue-600 ${hasValueClass}">
                        ${label}
                    </label>
                    ${suffix ? `<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none"><span class="text-slate-400 text-xs font-bold">${suffix}</span></div>` : ''}
                </div>`;
            },

            ModernSelect: (props) => {
                const { id, label, value = '', options = [], required, onChange } = props;
                const hasValueClass = value ? 'scale-75 -translate-y-3' : '';
                let optionsHtml = `<option value="" disabled ${!value ? 'selected' : ''} class="text-slate-400">Pilih...</option>`;
                options.forEach(opt => {
                    const val = typeof opt === 'object' ? opt.value : opt;
                    const lbl = typeof opt === 'object' ? opt.label : opt;
                    optionsHtml += `<option value="${val}" ${val === value ? 'selected' : ''}>${lbl}</option>`;
                });

                return `
                <div class="relative group w-full mb-4">
                    <select id="${id}" ${required ? 'required' : ''} ${onChange ? `onchange="${onChange}"` : ''}
                        class="block w-full px-4 pt-6 pb-2 text-base font-semibold text-slate-900 bg-white border border-slate-200 rounded-2xl appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all peer shadow-sm">
                        ${optionsHtml}
                    </select>
                    <label class="absolute text-[11px] font-bold text-slate-400 uppercase tracking-wider duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-focus:text-blue-600 ${hasValueClass}">${label}</label>
                    <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-slate-400">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clipRule="evenodd" fillRule="evenodd"></path></svg>
                    </div>
                </div>`;
            },

            LoginScreen: () => `
                <div class="flex flex-col h-screen bg-[#0B1B3D] justify-center items-center p-4">
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
                    <div class="absolute top-10 right-10 w-64 h-64 bg-blue-500/20 rounded-full mix-blend-screen filter blur-3xl"></div>
                    <div class="absolute bottom-10 left-10 w-64 h-64 bg-indigo-500/20 rounded-full mix-blend-screen filter blur-3xl"></div>
                    
                    <div class="w-full max-w-sm z-10">
                        <div class="text-center mb-10 animate-fade-in">
                            <div class="bg-white/10 w-20 h-20 mx-auto rounded-3xl shadow-inner border border-white/20 backdrop-blur-md flex items-center justify-center mb-4">
                                <i data-lucide="building-2" class="text-white drop-shadow-md" style="width: 40px; height: 40px;"></i>
                            </div>
                            <h1 class="text-4xl font-black tracking-tight leading-none mb-1 text-white flex items-center justify-center">MHS<span class="text-blue-400 font-bold ml-0.5">Pro</span></h1>
                            <p class="text-[10px] font-bold text-blue-200 uppercase tracking-[0.25em]">Smart Operations</p>
                        </div>
                        <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-6 shadow-2xl animate-fade-in" style="animation-delay: 0.1s">
                            <form onsubmit="app.login(event)">
                                <div class="space-y-4">
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i data-lucide="user-circle" class="text-blue-200" style="width: 20px; height: 20px;"></i></div>
                                        <input type="text" id="login-username" required placeholder="Username" class="w-full bg-white/10 text-white placeholder-blue-200/50 font-bold pl-12 pr-4 py-4 rounded-2xl outline-none border border-white/10 focus:border-blue-400 focus:bg-white/20 transition-all"/>
                                    </div>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i data-lucide="key-round" class="text-blue-200" style="width: 20px; height: 20px;"></i></div>
                                        <input type="password" id="login-password" required placeholder="Password" class="w-full bg-white/10 text-white placeholder-blue-200/50 font-bold pl-12 pr-4 py-4 rounded-2xl outline-none border border-white/10 focus:border-blue-400 focus:bg-white/20 transition-all"/>
                                    </div>
                                </div>
                                <button type="submit" ${app.state.isAuthLoading ? 'disabled' : ''} class="w-full mt-8 bg-blue-500 hover:bg-blue-400 text-white py-4 rounded-2xl font-black transition-all shadow-lg shadow-blue-500/30 active:scale-95 flex justify-center items-center disabled:opacity-70 disabled:cursor-wait">
                                    ${app.state.isAuthLoading ? '<i data-lucide="refresh-cw" class="animate-spin mr-2"></i>' : 'Masuk Aplikasi'}
                                </button>
                                ${app.state.loginError ? `
                                <div class="mt-4 p-3 bg-rose-500/20 border border-rose-500/50 rounded-xl text-rose-200 text-xs sm:text-sm font-bold text-center flex items-center justify-center animate-fade-in">
                                    <i data-lucide="alert-circle" class="mr-2 shrink-0" style="width: 16px; height: 16px;"></i><span class="text-left leading-tight">${app.state.loginError}</span>
                                </div>` : ''}
                            </form>
                        </div>
                    </div>

            saveStockForm: async (e) => {
                e.preventDefault();
                const fData = app.state.stockForm;
                const db = app.state.db;
                
                const existingLog = db.opnameLogs?.find(log => log.tanggal === fData.tanggal && log.shift === fData.shift);
                if (existingLog) {
                    app.showGlobalMessage(`Data Opname tanggal ${formatDate(fData.tanggal)} Shift ${fData.shift} sudah pernah disimpan!`, true); return;
                }
                
                const btn = document.getElementById('sf-submit-btn');
                btn.disabled = true; btn.classList.add('opacity-70', 'cursor-wait');
                document.getElementById('sf-submit-icon').classList.add('animate-spin');

                // Mengacu pada referensi LOGIKA V1.txt untuk logic pembagian FIFO opname
                const calculateNewBatches = (siloKey) => {
                    const formInput = fData[siloKey];
                    const prevSilo = db.lastStock[siloKey] || { batches: [] };
                    const awal = Number(formInput.awal) || 0;
                    let totalMasuk = siloKey === 'tapioka' ? (Number(formInput.masuk) || 0) : (Number(formInput.masukZak) || 0) + (Number(formInput.masukBulky) || 0);
                    const akhir = Number(formInput.akhir) || awal;
                    
                    const pemakaian = Math.max(0, (awal + totalMasuk) - akhir);
                    let currentBatches = [...(prevSilo.batches || [{ qty: awal, gluten: '-' }])];
                    
                    let remainingUsage = pemakaian;
                    while (remainingUsage > 0 && currentBatches.length > 0) {
                        if (currentBatches[0].qty <= remainingUsage) {
                            remainingUsage -= currentBatches[0].qty; currentBatches.shift(); 
                        } else {
                            currentBatches[0].qty -= remainingUsage; remainingUsage = 0;
                        }
                    }

                    if (totalMasuk > 0) currentBatches.push({ qty: totalMasuk, gluten: formInput.gluten || (currentBatches.length > 0 ? currentBatches[currentBatches.length-1].gluten : '-') });
                    
                    let totalBatchQty = currentBatches.reduce((sum, b) => sum + b.qty, 0);
                    if (totalBatchQty < akhir) {
                        const diff = akhir - totalBatchQty;
                        if (currentBatches.length > 0) currentBatches[currentBatches.length - 1].qty += diff;
                        else currentBatches.push({ qty: diff, gluten: prevSilo.batches?.[0]?.gluten || '-' });
                    } else if (totalBatchQty > akhir) {
                        let excess = totalBatchQty - akhir;
                        for (let i = currentBatches.length - 1; i >= 0 && excess > 0; i--) {
                            if (currentBatches[i].qty <= excess) { excess -= currentBatches[i].qty; currentBatches.pop(); } 
                            else { currentBatches[i].qty -= excess; excess = 0; }
                        }
                    }

                    if (currentBatches.length === 0 && akhir > 0) currentBatches.push({ qty: akhir, gluten: prevSilo.batches?.[0]?.gluten || '-' });
                    return currentBatches;
                };

                const newStockData = {
                    silo1: { akhir: fData.silo1.akhir || fData.silo1.awal, merk: fData.silo1.merk === 'LAINNYA' ? fData.silo1.customMerk : fData.silo1.merk, batches: calculateNewBatches('silo1') },
                    silo2: { akhir: fData.silo2.akhir || fData.silo2.awal, merk: fData.silo2.merk, batches: calculateNewBatches('silo2') },
                    silo3: { akhir: fData.silo3.akhir || fData.silo3.awal, merk: fData.silo3.merk, batches: calculateNewBatches('silo3') },
                    silo4: { akhir: fData.silo4.akhir || fData.silo4.awal, merk: fData.silo4.merk === 'LAINNYA' ? fData.silo4.customMerk : fData.silo4.merk, batches: calculateNewBatches('silo4') },
                    tapioka: { akhir: fData.tapioka.akhir || fData.tapioka.awal, merk: fData.tapioka.merk },
                    gula: { akhir: fData.gula.akhir, merk: fData.gula.merk }
                };
                
                const newLogEntry = { ...fData, id: Date.now(), timestamp: new Date().toISOString() };
                app.postData({ action: 'saveOpname', payload: { stock: newStockData, log: newLogEntry } }).catch(err => console.error(err));
                
                app.state.stockForm = null;
                btn.disabled = false; btn.classList.remove('opacity-70', 'cursor-wait');
                document.getElementById('sf-submit-icon').classList.remove('animate-spin');
                app.showSuccessModal('Berhasil!', 'Data opname shift ini telah disimpan.');
                app.renderActiveTab();
            },

                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; font-weight: bold; color: #2563eb;">${calcPakai(log.silo2?.awal, getTotalM(log.silo2), log.silo2?.akhir)}</td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; font-weight: bold;">${log.silo2?.akhir || 0}</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; font-weight: bold; color: #1e293b;">Silo 3 <span style="font-size:10px; color:#94a3b8; font-weight:normal; display:block;">${log.silo3?.merk || '-'}</span></td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right;">${log.silo3?.awal || 0}</td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right;">${rMasuk(log.silo3)}</td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; font-weight: bold; color: #2563eb;">${calcPakai(log.silo3?.awal, getTotalM(log.silo3), log.silo3?.akhir)}</td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; font-weight: bold;">${log.silo3?.akhir || 0}</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; font-weight: bold; color: #1e293b;">Silo 4 <span style="font-size:10px; color:#94a3b8; font-weight:normal; display:block;">${log.silo4?.merk || '-'}</span></td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right;">${log.silo4?.awal || 0}</td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right;">${rMasuk(log.silo4)}</td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; font-weight: bold; color: #2563eb;">${calcPakai(log.silo4?.awal, getTotalM(log.silo4), log.silo4?.akhir)}</td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; font-weight: bold;">${log.silo4?.akhir || 0}</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; font-weight: bold; color: #b45309; background: #fffbeb;">Tapioka <span style="font-size:10px; color:#d97706; font-weight:normal; display:block;">${log.tapioka?.merk || '-'}</span></td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; background: #fffbeb;">${log.tapioka?.awal || 0}</td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; background: #fffbeb;">${log.tapioka?.masuk || '-'}</td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; font-weight: bold; color: #2563eb; background: #fffbeb;">${calcPakai(log.tapioka?.awal, log.tapioka?.masuk, log.tapioka?.akhir)}</td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; font-weight: bold; background: #fffbeb;">${log.tapioka?.akhir || 0}</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; font-weight: bold; color: #4338ca; background: #eef2ff;">Gula <span style="font-size:10px; color:#6366f1; font-weight:normal; display:block;">${log.gula?.merk || '-'}</span></td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; background: #eef2ff; color:#94a3b8;">-</td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; background: #eef2ff; color:#94a3b8;">-</td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; background: #eef2ff; color:#94a3b8;">-</td>
                                        <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; font-weight: bold; background: #eef2ff;">${log.gula?.akhir || 0}</td>
                                    </tr>
                                </tbody>
                            </table>
                        `;
                        
                        if (log.catatanOpname && log.catatanOpname.trim() !== '') {
                            html += `
                            <div style="background: #eff6ff; border: 1px solid #bfdbfe; padding: 10px 15px; border-radius: 8px; margin-top: 5px;">
                                <p style="font-size: 10px; font-weight: bold; color: #1d4ed8; margin: 0 0 5px 0; text-transform: uppercase;">Catatan Opname Shift Ini:</p>
                                <p style="font-size: 12px; color: #1e293b; margin: 0; font-style: italic;">"${log.catatanOpname}"</p>
                            </div>
                            `;
                        }
                        html += `</div>`;
                    });
                    
                    pageDiv.innerHTML = html;
                    tempContainer.appendChild(pageDiv);
                    
                    // 3. Convert generated clean HTML directly to PDF page
                    try {
                        const canvas = await html2canvas(pageDiv, { scale: 2, useCORS: true });
                        const imgData = canvas.toDataURL('image/jpeg', 1.0);
                        const imgHeight = (canvas.height * pdfWidth) / canvas.width; // Maintains perfect aspect ratio
                        
                        if (!isFirstPage) {
                            pdf.addPage();
                        }
                        pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, imgHeight);
                        isFirstPage = false;
                    } catch(err) {
                        console.error("Error generating page for date", date, err);
                    }
                    
                    tempContainer.innerHTML = ''; // Clear for the next date page loop
                }
                
                document.body.removeChild(tempContainer);
                pdf.save(`Rekap_Opname_MHS_${new Date().getTime()}.pdf`);
                app.showSuccessModal('Selesai', 'PDF berhasil diunduh. (1 Hari / 3 Shift = 1 Halaman)');
            },

            exportOpnameExcel: () => {
                const logs = app.state.db.opnameLogs || [];
                const filters = app.state.recapFilters;
                let filteredLogs = logs.filter(log => {
                    const logWeek = getWeekNumber(new Date(log.timestamp)).toString();
                    const logDayName = getDayName(log.tanggal).toLowerCase();
                    return (filters.week === 'all' || logWeek === filters.week.toString()) && (filters.day === 'all' || logDayName === filters.day.toLowerCase());
                }).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                if (filteredLogs.length === 0) { app.showGlobalMessage("Tidak ada data.", true); return; }

                let csv = "Tanggal,Shift,Silo 1 Merk,S1 Awal,S1 Masuk Zak,S1 Masuk Bulky,S1 Pemakaian,S1 Akhir,Silo 2 Merk,S2 Awal,S2 Masuk Zak,S2 Masuk Bulky,S2 Pemakaian,S2 Akhir,Silo 3 Merk,S3 Awal,S3 Masuk Zak,S3 Masuk Bulky,S3 Pemakaian,S3 Akhir,Silo 4 Merk,S4 Awal,S4 Masuk Zak,S4 Masuk Bulky,S4 Pemakaian,S4 Akhir,Tapioka Merk,Tap Awal,Tap Masuk,Tap Pemakaian,Tap Akhir,Gula Merk,Gula Akhir,Catatan\n";
                filteredLogs.forEach(log => {
                    const calcP = (awal, mZak, mBulky, m, akhir) => calcPakai(awal, (Number(mZak)||0)+(Number(mBulky)||0)+(Number(m)||0), akhir);
                    const row = [
                        log.tanggal, log.shift,
                        log.silo1?.merk || '', log.silo1?.awal || 0, log.silo1?.masukZak || 0, log.silo1?.masukBulky || 0, calcP(log.silo1?.awal, log.silo1?.masukZak, log.silo1?.masukBulky, log.silo1?.masuk, log.silo1?.akhir), log.silo1?.akhir || 0,
                        log.silo2?.merk || '', log.silo2?.awal || 0, log.silo2?.masukZak || 0, log.silo2?.masukBulky || 0, calcP(log.silo2?.awal, log.silo2?.masukZak, log.silo2?.masukBulky, log.silo2?.masuk, log.silo2?.akhir), log.silo2?.akhir || 0,
                        log.silo3?.merk || '', log.silo3?.awal || 0, log.silo3?.masukZak || 0, log.silo3?.masukBulky || 0, calcP(log.silo3?.awal, log.silo3?.masukZak, log.silo3?.masukBulky, log.silo3?.masuk, log.silo3?.akhir), log.silo3?.akhir || 0,
                        log.silo4?.merk || '', log.silo4?.awal || 0, log.silo4?.masukZak || 0, log.silo4?.masukBulky || 0, calcP(log.silo4?.awal, log.silo4?.masukZak, log.silo4?.masukBulky, log.silo4?.masuk, log.silo4?.akhir), log.silo4?.akhir || 0,
                        log.tapioka?.merk || '', log.tapioka?.awal || 0, log.tapioka?.masuk || 0, calcP(log.tapioka?.awal, 0, 0, log.tapioka?.masuk, log.tapioka?.akhir), log.tapioka?.akhir || 0,
                        log.gula?.merk || '', log.gula?.akhir || 0, `"${(log.catatanOpname || '').replace(/"/g, '""')}"`
                    ];
                    csv += row.join(",") + "\n";
                });
                const link = document.createElement("a");
                link.setAttribute("href", URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' })));
                link.setAttribute("download", `Rekap_Opname_MHS_${new Date().getTime()}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            },

            showOpnameBulky: (tanggal, shift) => { app.state.selectedOpnameForBulky = { tanggal, shift }; app.renderActiveTab(); },
            closeOpnameBulkyModal: () => { app.state.selectedOpnameForBulky = null; app.renderActiveTab(); },

            openBulkySearch: () => { app.state.bulkyFilters.searchOpen = true; app.state.bulkyFilters.searchTxt = ''; app.renderActiveTab(); },
            typeBulkySearch: (val) => { app.state.bulkyFilters.searchTxt = val; app.renderActiveTab(); setTimeout(()=>document.getElementById('week-search-bulky').focus(),0); },
            selectBulkyWeek: (val) => { app.state.bulkyFilters.week = val; app.state.bulkyFilters.searchOpen = false; app.renderActiveTab(); },
            changeBulkyDay: (val) => { app.state.bulkyFilters.day = val; app.renderActiveTab(); },
            openBulkyModal: (merk) => { app.state.selectedMerkRecap = merk; app.renderActiveTab(); },
            closeBulkyModal: () => { app.state.selectedMerkRecap = null; app.renderActiveTab(); },
            
            exportBulkyPDF: async () => {
                const recapData = window.currentBulkyRecapData || {};
                if(Object.keys(recapData).length === 0) {
                    app.showGlobalMessage('Tidak ada data bulky untuk dicetak.', true); return;
                }
                
                app.showGlobalMessage('Menyiapkan PDF Bulky...', false);
                
                const tempDiv = document.createElement('div');
                tempDiv.style.position = 'absolute'; tempDiv.style.left = '-9999px'; tempDiv.style.top = '0';
                tempDiv.style.width = '800px'; tempDiv.style.backgroundColor = '#F4F7F9'; tempDiv.style.padding = '30px';
                
                const filterInfo = `Filter: ${window.currentBulkyFilters?.week === 'all' ? 'Semua Minggu' : 'Minggu Ke-'+window.currentBulkyFilters?.week} | ${window.currentBulkyFilters?.day === 'all' ? 'Semua Hari' : window.currentBulkyFilters?.day}`;
                
                let html = `<h1 style="font-size:28px; font-weight:900; color:#1e293b; margin-bottom:5px; font-family:sans-serif;">Rincian Rekap Bulky MHS</h1>`;
                html += `<p style="margin-bottom:30px; font-size:14px; font-weight:bold; color:#64748b; font-family:sans-serif;">${filterInfo} (Dicetak: ${new Date().toLocaleString('id-ID')})</p>`;
                
                Object.keys(recapData).forEach(merk => {
                    html += `<div style="background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:20px; margin-bottom:20px; font-family:sans-serif;">`;
                    html += `<h2 style="font-size:22px; font-weight:900; color:#334155; margin-bottom:15px; border-bottom:2px solid #f1f5f9; padding-bottom:10px;">Merk: ${merk} <span style="font-size:12px; font-weight:bold; color:#94a3b8; background:#f8fafc; padding:4px 8px; border-radius:6px; float:right;">Total: ${recapData[merk].count} Kendaraan</span></h2>`;
                    
                    recapData[merk].logs.forEach(log => {
                        html += `
                        <div style="background:#fff; border:1px solid #cbd5e1; border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,0.05);">
                            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                                <div>
                                    <div style="font-weight:900; font-size:18px; color:#1e293b;">${log.noBulky}</div>
                                    <div style="font-size:12px; font-weight:bold; color:#64748b;">Bongkar: ${formatDate(log.tanggal)} • Shift ${log.shift}</div>
                                    ${log.tanggalKedatangan ? `<div style="font-size:12px; font-weight:bold; color:#3b82f6; margin-top:2px;">Datang: ${formatDate(log.tanggalKedatangan)}</div>` : ''}
                                </div>
                                <span style="background:#eff6ff; color:#1d4ed8; border:1px solid #dbeafe; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; text-transform:uppercase; height:fit-content;">${log.tujuanSilo || 'Tidak ada data'}</span>
                            </div>
                            
                            <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; text-align:center; background:#f8fafc; border-radius:12px; padding:12px; margin-bottom:12px; border:1px solid #e2e8f0;">
                                <div><div style="font-size:10px; color:#94a3b8; font-weight:bold; text-transform:uppercase; margin-bottom:4px;">Masuk</div><div style="font-weight:600; font-size:14px; color:#334155;">${formatTime(log.jamMasuk)}</div></div>
                                <div><div style="font-size:10px; color:#94a3b8; font-weight:bold; text-transform:uppercase; margin-bottom:4px;">Release</div><div style="font-weight:600; font-size:14px; color:#334155;">${formatTime(log.jamRelease)}</div></div>
                                <div><div style="font-size:10px; color:#94a3b8; font-weight:bold; text-transform:uppercase; margin-bottom:4px;">Bongkar</div><div style="font-weight:600; font-size:14px; color:#334155;">${formatTime(log.jamBongkar)}</div></div>
                                <div><div style="font-size:10px; color:#94a3b8; font-weight:bold; text-transform:uppercase; margin-bottom:4px;">Selesai</div><div style="font-weight:600; font-size:14px; color:#334155;">${formatTime(log.jamSelesai)}</div></div>
                            </div>
                            
                            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; text-align:center; border-top:1px solid #e2e8f0; padding-top:12px;">
                                <div><div style="font-size:11px; color:#94a3b8; font-weight:bold; text-transform:uppercase;">Awal</div><div style="font-weight:900; font-size:16px; color:#334155;">${log.qtyAwal} <span style="font-size:11px; opacity:0.5; font-weight:500;">kg</span></div></div>
                                <div style="border-left:1px solid #e2e8f0; border-right:1px solid #e2e8f0;"><div style="font-size:11px; color:#94a3b8; font-weight:bold; text-transform:uppercase;">Akhir</div><div style="font-weight:900; font-size:16px; color:#334155;">${log.qtyAkhir} <span style="font-size:11px; opacity:0.5; font-weight:500;">kg</span></div></div>
                                <div><div style="font-size:11px; color:#fb7185; font-weight:bold; text-transform:uppercase;">Susut</div><div style="font-weight:900; font-size:16px; color:#e11d48;">${Number(log.qtyAwal) - Number(log.qtyAkhir)} <span style="font-size:11px; opacity:0.5; font-weight:500;">kg</span></div></div>
                            </div>
                            
                            ${log.catatan ? `<div style="margin-top:12px; padding-top:12px; border-top:1px solid #e2e8f0;"><p style="font-size:10px; color:#64748b; font-weight:bold; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px;">Catatan</p><p style="font-size:13px; font-weight:600; color:#334155; font-style:italic;">"${log.catatan}"</p></div>` : ''}
                        </div>`;
                    });
                    html += `</div>`;
                });
                
                tempDiv.innerHTML = html;
                document.body.appendChild(tempDiv);
                
                try {
                    const canvas = await html2canvas(tempDiv, { scale: 2, useCORS: true });
                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pageHeight = pdf.internal.pageSize.getHeight();
                    const imgHeight = (canvas.height * pdfWidth) / canvas.width;
                    
                    let heightLeft = imgHeight;
                    let position = 0;
                    
                    pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeight);
                    heightLeft -= pageHeight;
                    
                    while (heightLeft >= 0) {
                        position = heightLeft - imgHeight;
                        pdf.addPage();
                        pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeight);
                        heightLeft -= pageHeight;
                    }
                    pdf.save(`Rincian_Bulky_MHS_${new Date().getTime()}.pdf`);
                    app.showSuccessModal('Selesai', 'PDF Bulky berhasil diunduh.');
                } catch(e) {
                    app.showGlobalMessage('Gagal membuat PDF', true);
                } finally {
                    document.body.removeChild(tempDiv);
                }
            },

            exportBulkyExcel: () => {
                const logs = app.state.db.bulkyLogs || [];
                const filters = app.state.bulkyFilters;
                let filteredLogs = logs.filter(log => {
                    const logWeek = getWeekNumber(new Date(log.timestamp)).toString();
                    return (filters.week === 'all' || logWeek === filters.week.toString()) && (filters.day === 'all' || getDayName(log.tanggal).toLowerCase() === filters.day.toLowerCase());
                }).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                if (filteredLogs.length === 0) { app.showGlobalMessage("Tidak ada data.", true); return; }

                let csv = "Tgl Kedatangan,Tgl Bongkar,Shift,No Bulky,Merk,Tujuan Silo,Jam Masuk,Jam Release,Jam Bongkar,Jam Selesai,Qty Awal,Qty Akhir,Susut,Catatan\n";
                filteredLogs.forEach(log => {
                    csv += `${log.tanggalKedatangan||''},${log.tanggal||''},${log.shift||''},"${log.noBulky||''}","${log.merk||''}",${log.tujuanSilo||''},${formatTime(log.jamMasuk)},${formatTime(log.jamRelease)},${formatTime(log.jamBongkar)},${formatTime(log.jamSelesai)},${log.qtyAwal||0},${log.qtyAkhir||0},${(Number(log.qtyAwal)||0)-(Number(log.qtyAkhir)||0)},"${(log.catatan||'').replace(/"/g, '""')}"\n`;
                });
                const link = document.createElement("a");
                link.setAttribute("href", URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' })));
                link.setAttribute("download", `Rekap_Bulky_MHS_${new Date().getTime()}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            },

            shareBulkyRecap: () => {
                const recapData = window.currentBulkyRecapData || {};
                let msg = `*REKAP BONGKAR BULKY*\nMinggu: ${window.currentBulkyFilters?.week === 'all' ? 'Semua Minggu' : 'Ke-'+window.currentBulkyFilters?.week}\nHari: ${window.currentBulkyFilters?.day === 'all' ? 'Semua Hari' : window.currentBulkyFilters?.day.charAt(0).toUpperCase() + window.currentBulkyFilters?.day.slice(1)}\n\n`;
                if (Object.keys(recapData).length === 0) msg += `Belum ada data.`;
                else Object.keys(recapData).forEach(merk => { msg += `*${merk}*\n- Total Kendaraan: ${recapData[merk].count}\n- Total Muatan: ${recapData[merk].totalAwal} kg\n- Total Susut: ${recapData[merk].totalSusut} kg\n\n`; });
                window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
            },

            saveBulkyForm: async (e) => {
                e.preventDefault();
                const fData = app.state.bulkyForm;
                if(!fData.noBulky || !fData.merk || !fData.tujuanSilo) return;
                
                const btn = document.getElementById('bf-submit-btn');
                btn.disabled = true; btn.classList.add('opacity-70', 'cursor-wait');
                document.getElementById('bf-submit-icon').classList.add('animate-spin');
                app.postData({ action: 'saveBulky', payload: { ...fData, id: Date.now(), timestamp: new Date(fData.tanggal).getTime() } }).catch(()=>{});
                app.state.bulkyForm = { ...fData, noBulky: '', merk: '', tujuanSilo: '', jamMasuk: '', jamRelease: '', jamBongkar: '', jamSelesai: '', qtyAwal: '', qtyAkhir: '', catatan: '' };
                btn.disabled = false; btn.classList.remove('opacity-70', 'cursor-wait');
                document.getElementById('bf-submit-icon').classList.remove('animate-spin');
                app.showSuccessModal('Berhasil!', 'Data bongkar bulky telah disimpan.');
            },

            saveMaintenanceForm: async (e) => {
                e.preventDefault();
                const btn = document.getElementById('mf-submit-btn');
                btn.disabled = true; btn.classList.add('opacity-70', 'cursor-wait');
                document.getElementById('mf-submit-icon').classList.add('animate-spin');
                app.postData({ action: 'saveMaintenance', payload: { ...app.state.maintenanceForm, id: Date.now(), timestamp: new Date().toISOString() } }).catch(()=>{});
                app.state.maintenanceForm = { ...app.state.maintenanceForm, part: '', kendala: '', perbaikan: '' };
                btn.disabled = false; btn.classList.remove('opacity-70', 'cursor-wait');
                document.getElementById('mf-submit-icon').classList.remove('animate-spin');
                app.showSuccessModal('Berhasil!', 'Laporan kendala mesin telah disimpan.');
            },
            
            shareMaintenance: (log) => {
                let msg = `*LAPORAN KENDALA MESIN MHS*\n\nHari/Tanggal : ${getDayName(log.tanggal)}, ${formatDate(log.tanggal)}\nShift : ${log.shift} (Grup ${log.grup})\n\n*⚙️ Part Kendala:*\n${log.part}\n\n*⚠️ Detail Kendala:*\n${log.kendala}\n\n*🔧 Tindakan Perbaikan:*\n${log.perbaikan}\n`;
                window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
            }
        };

        document.addEventListener('click', (e) => {
            if (app.state.recapFilters.searchOpen && !e.target.closest('#week-search-container')) {
                app.state.recapFilters.searchOpen = false; if(app.state.activeTab === 'recap') app.renderActiveTab();
            }
            if (app.state.bulkyFilters.searchOpen && !e.target.closest('#week-search-container')) {
                app.state.bulkyFilters.searchOpen = false; if(app.state.activeTab === 'bulky') app.renderActiveTab();
            }
        });

        window.onload = () => app.render();

    </script>
