<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHS Pro - Smart Operations</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0B1B3D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MHS Pro">
    
    <link rel="icon" type="image/png" href="https://www.image2url.com/r2/default/files/1790301105424-7b6b60f2-4ebe-41f8-a0d1-384221bc41ad.png">
    <link rel="apple-touch-icon" href="https://www.image2url.com/r2/default/files/1790301105424-7b6b60f2-4ebe-41f8-a0d1-384221bc41ad.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #F4F7F9;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
        
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-scale-in { animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
        .ease-spring { transition-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .custom-date-input::-webkit-calendar-picker-indicator {
            background: transparent; bottom: 0; color: transparent; cursor: pointer;
            height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .nav-scroll-container::-webkit-scrollbar { display: none; }
        .nav-scroll-container { -ms-overflow-style: none; scrollbar-width: none; }
        
        html, body { overflow-x: hidden; }
        .lucide { display: inline-block; }
    </style>
</head>
<body class="font-sans bg-[#F4F7F9] text-slate-800 selection:bg-blue-200">
    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
        }

        const API_URL = "https://script.google.com/macros/s/AKfycbxnWOh6-FIn5v_kNalNsIi4QgZoRJ_6htXU_N0AWln2-nUWPTuEuRRwr9mjMCTB6TODdQ/exec";
        const DAYS_OF_WEEK = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
        
        const SILO_MERK_OPTIONS = { soft: ['B7', 'LM', 'MILA', 'FALCONILA', 'B7 MKL', 'LAINNYA'], medium: ['W3', 'LAINNYA'] };
        const SILO_LINES = { silo1: ['2.1', '4.1'], silo2: ['1.1', '3.1', '5.1', '2.1'], silo3: ['1.1', '2.1', '3.1', '5.1', '4.2'], silo4: ['2.2', '3.2', '5.2'] };

        const parseLines = (val) => {
            if (Array.isArray(val)) return val;
            if (typeof val === 'string') return val.split(/[|,]/).map(s => s.trim()).filter(Boolean);
            return [];
        };

        const getWeekNumber = (date) => {
            if (!date) return 0;
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        };

        const getRecentWeeks = (logs = []) => {
            const weeks = new Set();
            logs.forEach(l => { if(l.tanggal || l.timestamp) weeks.add(getWeekNumber(new Date(l.tanggal || l.timestamp))); });
            return Array.from(weeks).sort((a,b)=>b-a).slice(0,3);
        };

        const getCurrentShiftInfo = () => {
            const now = new Date();
            const hours = now.getHours();
            let shift = '1';
            let date = new Date(now);
            if (hours >= 7 && hours < 15) { shift = '1'; } 
            else if (hours >= 15 && hours < 23) { shift = '2'; } 
            else { shift = '3'; if (hours < 7) { date.setDate(date.getDate() - 1); } }
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return { shift, date: `${year}-${month}-${day}`, month: `${year}-${month}` };
        };

        const getDayName = (dateStr) => {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleDateString('id-ID', { weekday: 'long' });
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        };
        
        const formatDateToYYYYMMDD = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        };

        const formatTime = (timeStr) => {
            if (!timeStr || timeStr === '-') return '-';
            if (typeof timeStr === 'string') {
                if (/^\d{2}:\d{2}$/.test(timeStr)) return timeStr;
                if (/^\d{2}:\d{2}:\d{2}/.test(timeStr)) return timeStr.substring(0, 5);
            }
            try {
                const d = new Date(timeStr);
                if (!isNaN(d.getTime())) return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
            } catch (e) {}
            return String(timeStr);
        };

        const calcPakai = (awal, totalMasuk, akhir) => {
            if (akhir === '' || akhir === null || akhir === undefined) return 0;
            const p = (Number(awal) || 0) + (Number(totalMasuk) || 0) - (Number(akhir) || 0);
            return p > 0 ? p : 0;
        };

        const cachedDB = localStorage.getItem('mhs_db_cache');
        const cachedUser = localStorage.getItem('mhs_user_cache');

        const app = {
            state: {
                user: cachedUser ? JSON.parse(cachedUser) : null, 
                activeTab: 'dashboard',
                isAuthLoading: false,
                loginError: '',
                globalMessage: null,
                isSyncing: false,
                db: cachedDB ? JSON.parse(cachedDB) : { lastStock: null, opnameLogs: [], bulkyLogs: [], maintenanceLogs: [] },
                stockForm: null,
                recapFilters: { week: 'all', day: 'all' },
                bulkyFilters: { week: 'all', day: 'all' },
                traceFilters: { searchTxt: '' },
                bulkyForm: null,
                maintenanceForm: null
            },

            render: function() {
                const root = document.getElementById('root');
                if (!this.state.user) {
                    root.innerHTML = Components.LoginScreen();
                } else {
                    root.innerHTML = Components.Layout();
                    this.renderActiveTab();
                    this.updateNavIndicator();
                }
                this.renderGlobalMessage();
                lucide.createIcons();
            },

            renderActiveTab: function() {
                const container = document.getElementById('main-content');
                if (!container) return;
                
                let content = '';
                switch (this.state.activeTab) {
                    case 'dashboard': content = Views.Dashboard(); break;
                    case 'stock': content = Views.StockForm(); break;
                    case 'recap': content = Views.OpnameRecap(); break;
                    case 'bulky': content = Views.BulkyForm(); break;
                    case 'trace': content = Views.Traceability(); break;
                    case 'maintenance': content = Views.MaintenanceForm(); break;
                }
                container.innerHTML = content;
                lucide.createIcons();
            },

            switchTab: function(tabId) {
                if(this.state.activeTab === tabId) return;
                this.state.activeTab = tabId;
                this.renderActiveTab();
                this.updateNavIndicator();
                
                document.querySelectorAll('.nav-item').forEach(el => {
                    const id = el.dataset.id;
                    const iconContainer = el.querySelector('.icon-container');
                    const label = el.querySelector('.nav-label');
                    const icon = el.querySelector('svg') || el.querySelector('i');
                    
                    if (id === tabId) {
                        iconContainer.className = 'icon-container transition-all duration-300 text-blue-600 transform -translate-y-1 drop-shadow-sm';
                        label.className = 'nav-label text-[9px] sm:text-[10px] mt-1 transition-all duration-300 font-black text-blue-700';
                        if (icon) { icon.style.width = '24px'; icon.style.height = '24px'; }
                        el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    } else {
                        iconContainer.className = 'icon-container transition-all duration-300 text-slate-400 group-hover:text-slate-600 group-hover:-translate-y-0.5';
                        label.className = 'nav-label text-[9px] sm:text-[10px] mt-1 transition-all duration-300 font-bold text-slate-400';
                        if (icon) { icon.style.width = '22px'; icon.style.height = '22px'; }
                    }
                });
            },

            updateNavIndicator: function() {
                const indicator = document.getElementById('nav-indicator');
                if (!indicator) return;
                let tabs = ['dashboard', 'stock', 'recap', 'bulky', 'trace', 'maintenance'];
                if (this.state.user?.role === 'viewer') tabs = ['dashboard', 'recap', 'bulky', 'trace', 'maintenance'];
                const activeIndex = tabs.indexOf(this.state.activeTab);
                
                if(navItems = document.querySelectorAll('.nav-item'), navItems.length > 0 && navItems[activeIndex]) {
                    const activeEl = navItems[activeIndex];
                    indicator.style.width = `${activeEl.offsetWidth - 16}px`;
                    indicator.style.left = `${activeEl.offsetLeft + 8}px`;
                }
            },

            showGlobalMessage: function(msg, isError = true) {
                this.state.globalMessage = { text: msg, isError };
                this.renderGlobalMessage();
                setTimeout(() => { this.state.globalMessage = null; this.renderGlobalMessage(); }, 3500);
            },

            renderGlobalMessage: function() {
                let existing = document.getElementById('global-message');
                if (existing) existing.remove();
                if (this.state.globalMessage) {
                    const msg = this.state.globalMessage;
                    const div = document.createElement('div');
                    div.id = 'global-message';
                    div.className = `fixed top-6 left-1/2 transform -translate-x-1/2 ${msg.isError ? 'bg-rose-900/95 border-rose-700/50 text-white' : 'bg-slate-900/95 border-slate-700/50 text-white'} backdrop-blur-md px-4 py-3 sm:px-6 sm:py-4 rounded-full shadow-2xl text-xs sm:text-sm font-bold flex items-center z-[100] border animate-fade-in whitespace-nowrap`;
                    const iconColor = msg.isError ? 'text-rose-400' : 'text-emerald-400';
                    const iconName = msg.isError ? 'alert-circle' : 'check-circle-2';
                    div.innerHTML = `<i data-lucide="${iconName}" class="mr-2 sm:mr-3 ${iconColor}" style="width: 18px; height: 18px;"></i> ${msg.text}`;
                    document.body.appendChild(div);
                    lucide.createIcons({root: div});
                }
            },

            showSuccessModal: function(title, message) {
                let existing = document.getElementById('success-modal');
                if (existing) existing.remove();
                const div = document.createElement('div');
                div.id = 'success-modal';
                div.className = 'fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm';
                div.innerHTML = `
                    <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl flex flex-col items-center text-center animate-scale-in border border-slate-100">
                        <div class="w-20 h-20 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mb-5 shadow-inner border border-emerald-200">
                            <i data-lucide="check-circle" stroke-width="2.5" style="width: 40px; height: 40px;"></i>
                        </div>
                        <h3 class="text-2xl font-black text-slate-800 mb-2">${title}</h3>
                        <p class="text-sm font-semibold text-slate-500 mb-6">${message}</p>
                        <button onclick="document.getElementById('success-modal').remove()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-black py-4 rounded-2xl transition-colors shadow-lg shadow-emerald-500/30 active:scale-95 text-sm uppercase tracking-widest">Selesai</button>
                    </div>`;
                document.body.appendChild(div);
                lucide.createIcons({root: div});
                setTimeout(() => { const el = document.getElementById('success-modal'); if(el) el.remove(); }, 3500);
            },

            login: async function(e) {
                e.preventDefault();
                const username = document.getElementById('login-username').value;
                const password = document.getElementById('login-password').value;
                this.state.loginError = '';
                
                this.state.isAuthLoading = true;
                this.render(); 
                
                try {
                    const res = await fetch(`${API_URL}?action=login&username=${username}&password=${password}`);
                    const data = await res.json();
                    if (data.success) {
                        this.state.user = { username: data.username, role: data.role };
                        localStorage.setItem('mhs_user_cache', JSON.stringify(this.state.user));
                        this.fetchData();
                        this.render();
                    } else {
                        this.state.loginError = "Login Gagal: Username atau Password salah.";
                    }
                } catch (err) {
                    this.state.loginError = "Koneksi ditolak server. Pastikan API_URL valid dan internet stabil.";
                }
                this.state.isAuthLoading = false;
                if(!this.state.user) this.render();
            },

            logout: function() { 
                this.state.user = null; 
                localStorage.removeItem('mhs_user_cache');
                this.render(); 
            },

            fetchData: async function() {
                this.state.isSyncing = true;
                this.updateSyncUI(true);
                try {
                    const res = await fetch(`${API_URL}?action=getData`);
                    const data = await res.json();
                    this.state.db = data;
                    localStorage.setItem('mhs_db_cache', JSON.stringify(data));
                    if(['dashboard', 'recap', 'maintenance', 'bulky', 'trace'].includes(this.state.activeTab)) {
                         this.renderActiveTab();
                    }
                } catch (err) {
                    this.showGlobalMessage("Gagal sinkronisasi data dari Google Sheets.");
                }
                this.state.isSyncing = false;
                this.updateSyncUI(false);
            },

            updateSyncUI: function(isSyncing) {
                const btn = document.getElementById('sync-btn');
                const icon = document.getElementById('sync-icon');
                const text = document.getElementById('sync-text');
                if(!btn) return;
                
                if (isSyncing) {
                    btn.disabled = true; btn.classList.add('opacity-70', 'cursor-wait');
                    icon.classList.add('animate-spin'); icon.classList.remove('group-hover:rotate-180', 'transition-transform', 'duration-700');
                    if(text) text.innerText = 'Syncing';
                } else {
                    btn.disabled = false; btn.classList.remove('opacity-70', 'cursor-wait');
                    icon.classList.remove('animate-spin'); icon.classList.add('group-hover:rotate-180', 'transition-transform', 'duration-700');
                    if(text) text.innerText = 'Sync';
                }
            },

            postData: async function(payloadData) {
                try {
                    if(payloadData.action === 'saveOpname') {
                        this.state.db.lastStock = { ...this.state.db.lastStock, ...payloadData.payload.stock };
                        this.state.db.opnameLogs = [payloadData.payload.log, ...(this.state.db.opnameLogs || [])];
                    } else if (payloadData.action === 'saveBulky') {
                        this.state.db.bulkyLogs = [payloadData.payload, ...(this.state.db.bulkyLogs || [])];
                        if(this.state.activeTab === 'bulky') this.renderActiveTab();
                    } else if (payloadData.action === 'saveMaintenance') {
                        this.state.db.maintenanceLogs = [payloadData.payload, ...(this.state.db.maintenanceLogs || [])];
                        if(this.state.activeTab === 'maintenance') this.renderActiveTab();
                    }

                    const params = new URLSearchParams();
                    params.append('action', payloadData.action);
                    
                    const flatten = (obj, prefix = '') => {
                        for (const key in obj) {
                            if (Object.prototype.hasOwnProperty.call(obj, key)) {
                                const val = obj[key];
                                const newKey = prefix ? `${prefix}_${key}` : key;
                                if (val !== null && typeof val === 'object') {
                                    if (Array.isArray(val) && (val.length === 0 || typeof val[0] !== 'object')) {
                                        params.append(newKey, val.filter(v => v !== null && String(v).trim() !== '').join(' | '));
                                    } else {
                                        flatten(val, newKey);
                                    }
                                } else {
                                    params.append(newKey, val !== undefined && val !== null ? val : '');
                                }
                            }
                        }
                    };
                    if (payloadData.payload) flatten(payloadData.payload);
                    await fetch(API_URL, { method: 'POST', body: params });
                } catch (err) {
                    this.showGlobalMessage("Gagal menyimpan data ke server.");
                }
            }
        };

        const Components = {
            Card: (content, className = '', padding = 'p-5') => {
                const overflowClass = className.includes('overflow-') ? '' : 'overflow-hidden';
                return `<div class="bg-white/90 backdrop-blur-sm rounded-[1.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-200/60 transition-all duration-300 hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] ${overflowClass} ${padding} ${className}">${content}</div>`;
            },
            
            Badge: (content, variant = 'primary') => {
                const variants = {
                    primary: 'bg-blue-50 text-blue-700 border border-blue-100',
                    success: 'bg-emerald-50 text-emerald-700 border border-emerald-100',
                    warning: 'bg-amber-50 text-amber-700 border border-amber-100',
                    danger: 'bg-rose-50 text-rose-700 border border-rose-100',
                    slate: 'bg-slate-100 text-slate-600 border border-slate-200',
                };
                return `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider border ${variants[variant]}">${content}</span>`;
            },

            FloatingInput: (props) => {
                const { id, label, type = 'text', value = '', placeholder = ' ', min, step, suffix, disabled, required, onInput } = props;
                const disabledClasses = disabled ? 'opacity-70 bg-slate-50 cursor-not-allowed text-slate-500 font-semibold' : '';
                const hasValueClass = value ? 'scale-75 -translate-y-3' : '';
                
                return `
                <div class="relative group w-full mb-4">
                    <input type="${type}" id="${id}" ${value ? `value="${value}"` : ''} placeholder="${placeholder}" ${min ? `min="${min}"` : ''} ${step ? `step="${step}"` : ''} ${required ? 'required' : ''} ${disabled ? 'disabled' : ''} ${onInput ? `oninput="${onInput}"` : ''}
                        class="block w-full px-4 pt-6 pb-2 text-base font-medium text-slate-900 bg-white border border-slate-200 rounded-2xl appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all peer shadow-sm ${disabledClasses}"
                    />
                    <label class="absolute text-[11px] font-bold text-slate-400 uppercase tracking-wider duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3 peer-focus:text-blue-600 ${hasValueClass}">
                        ${label}
                    </label>
                    ${suffix ? `<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none"><span class="text-slate-400 text-xs font-bold">${suffix}</span></div>` : ''}
                </div>`;
            },

            ModernSelect: (props) => {
                const { id, label, value = '', options = [], required, disabled, onChange } = props;
                const hasValueClass = value ? 'scale-75 -translate-y-3' : '';
                const disabledClasses = disabled ? 'opacity-70 bg-slate-50 cursor-not-allowed text-slate-500 font-semibold' : '';
                let optionsHtml = `<option value="" disabled ${!value ? 'selected' : ''} class="text-slate-400">Pilih...</option>`;
                options.forEach(opt => {
                    const val = typeof opt === 'object' ? opt.value : opt;
                    const lbl = typeof opt === 'object' ? opt.label : opt;
                    optionsHtml += `<option value="${val}" ${val === value ? 'selected' : ''}>${lbl}</option>`;
                });

                return `
                <div class="relative group w-full mb-4">
                    <select id="${id}" ${required ? 'required' : ''} ${disabled ? 'disabled' : ''} ${onChange ? `onchange="${onChange}"` : ''}
                        class="block w-full px-4 pt-6 pb-2 text-base font-semibold text-slate-900 bg-white border border-slate-200 rounded-2xl appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all peer shadow-sm ${disabledClasses}">
                        ${optionsHtml}
                    </select>
                    <label class="absolute text-[11px] font-bold text-slate-400 uppercase tracking-wider duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-focus:text-blue-600 ${hasValueClass}">${label}</label>
                    <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-slate-400">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clipRule="evenodd" fillRule="evenodd"></path></svg>
                    </div>
                </div>`;
            },

            LoginScreen: () => `
                <div class="flex flex-col h-screen bg-[#0B1B3D] justify-center items-center p-4">
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
                    <div class="absolute top-10 right-10 w-64 h-64 bg-blue-500/20 rounded-full mix-blend-screen filter blur-3xl"></div>
                    <div class="absolute bottom-10 left-10 w-64 h-64 bg-indigo-500/20 rounded-full mix-blend-screen filter blur-3xl"></div>
                    
                    <div class="w-full max-w-sm z-10">
                        <div class="text-center mb-10 animate-fade-in">
                            <div class="bg-white/10 w-20 h-20 mx-auto rounded-3xl shadow-inner border border-white/20 backdrop-blur-md flex items-center justify-center mb-4">
                                <i data-lucide="building-2" class="text-white drop-shadow-md" style="width: 40px; height: 40px;"></i>
                            </div>
                            <h1 class="text-4xl font-black tracking-tight leading-none mb-1 text-white flex items-center justify-center">MHS<span class="text-blue-400 font-bold ml-0.5">Pro</span></h1>
                            <p class="text-[10px] font-bold text-blue-200 uppercase tracking-[0.25em]">Smart Operations</p>
                        </div>
                        <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-6 shadow-2xl animate-fade-in" style="animation-delay: 0.1s">
                            <form onsubmit="app.login(event)">
                                <div class="space-y-4">
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i data-lucide="user-circle" class="text-blue-200" style="width: 20px; height: 20px;"></i></div>
                                        <input type="text" id="login-username" required placeholder="Username" class="w-full bg-white/10 text-white placeholder-blue-200/50 font-bold pl-12 pr-4 py-4 rounded-2xl outline-none border border-white/10 focus:border-blue-400 focus:bg-white/20 transition-all"/>
                                    </div>
                                    <div class="relative">

            updateStockForm: (siloKey, field, value) => {
                const fData = app.state.stockForm;
                if(fData.isExisting) return; // Prevent logic updates if disabled

                if (field === 'merk' && (siloKey.startsWith('silo') || siloKey === 'tapioka')) {
                    const customContainer = document.getElementById(`sf-${siloKey}-customMerk-container`);
                    if (customContainer) customContainer.className = value === 'LAINNYA' ? 'block mb-4' : 'hidden sm:block';
                }
                if (['awal', 'masuk', 'masukZak', 'masukBulky', 'akhir'].includes(field)) {
                    const pemakaianLabel = document.getElementById(`pemakaian-${siloKey}`);
                    if (pemakaianLabel) {
                        let totalMasuk = siloKey === 'tapioka' ? fData[siloKey].masuk : (Number(fData[siloKey].masukZak) || 0) + (Number(fData[siloKey].masukBulky) || 0);

                }

            toggleLine: (siloKey, line) => {
                const fData = app.state.stockForm;
                if(fData.isExisting) return;
                
                let current = parseLines(fData[siloKey].lines);
                const idx = current.indexOf(line);
                if (idx > -1) current.splice(idx, 1);
                else current.push(line);
                fData[siloKey].lines = current;
                app.renderActiveTab();
            },

            selectAllLines: (siloKey) => {
                const fData = app.state.stockForm;
                if(fData.isExisting) return;

                const all = SILO_LINES[siloKey];
                let current = parseLines(fData[siloKey].lines);
                if (current.length === all.length) fData[siloKey].lines = [];
                else fData[siloKey].lines = [...all];

            },

            saveStockForm: async (e) => {
                e.preventDefault();
                const fData = app.state.stockForm;
                const db = app.state.db;
                
                if (fData.isExisting) return;

                const existingLog = db.opnameLogs?.find(log => log.tanggal === fData.tanggal && log.shift === fData.shift);
                if (existingLog) {
                    app.showGlobalMessage(`Data Opname tanggal ${formatDate(fData.tanggal)} Shift ${fData.shift} sudah pernah disimpan!`, true); 
                    Handlers.checkExistingOpname(); 
                    return;
                }
                
                const btn = document.getElementById('sf-submit-btn');
                btn.disabled = true; btn.classList.add('opacity-70', 'cursor-wait');
                document.getElementById('sf-submit-icon').classList.add('animate-spin');

                const calculateNewBatches = (siloKey) => {
                    const formInput = fData[siloKey];
                    const prevSilo = db.lastStock[siloKey] || { batches: [] };
                    const awal = Number(formInput.awal) || 0;
                    let totalMasuk = siloKey === 'tapioka' ? (Number(formInput.masuk) || 0) : (Number(formInput.masukZak) || 0) + (Number(formInput.masukBulky) || 0);
                    const akhir = Number(formInput.akhir) || awal;
                    
                    const pemakaian = Math.max(0, (awal + totalMasuk) - akhir);
                    let currentBatches = [...(prevSilo.batches || [{ qty: awal, gluten: '-' }])];
                    
                    let remainingUsage = pemakaian;
                    while (remainingUsage > 0 && currentBatches.length > 0) {
                        if (currentBatches[0].qty <= remainingUsage) {
                            remainingUsage -= currentBatches[0].qty; currentBatches.shift(); 
                        } else {
                            currentBatches[0].qty -= remainingUsage; remainingUsage = 0;
                        }
                    }

                    if (totalMasuk > 0) currentBatches.push({ qty: totalMasuk, gluten: formInput.gluten || (currentBatches.length > 0 ? currentBatches[currentBatches.length-1].gluten : '-') });
                    
                    let totalBatchQty = currentBatches.reduce((sum, b) => sum + b.qty, 0);
                    if (totalBatchQty < akhir) {
                        const diff = akhir - totalBatchQty;
                        if (currentBatches.length > 0) currentBatches[currentBatches.length - 1].qty += diff;
                        else currentBatches.push({ qty: diff, gluten: prevSilo.batches?.[0]?.gluten || '-' });
                    } else if (totalBatchQty > akhir) {
                        let excess = totalBatchQty - akhir;
                        for (let i = currentBatches.length - 1; i >= 0 && excess > 0; i--) {
                            if (currentBatches[i].qty <= excess) { excess -= currentBatches[i].qty; currentBatches.pop(); } 
                            else { currentBatches[i].qty -= excess; excess = 0; }
                        }
                    }

                    if (currentBatches.length === 0 && akhir > 0) currentBatches.push({ qty: akhir, gluten: prevSilo.batches?.[0]?.gluten || '-' });
                    return currentBatches;
                };

                const newStockData = {
                    silo1: { akhir: fData.silo1.akhir || fData.silo1.awal, merk: fData.silo1.merk === 'LAINNYA' ? fData.silo1.customMerk : fData.silo1.merk, batches: calculateNewBatches('silo1') },
                    silo2: { akhir: fData.silo2.akhir || fData.silo2.awal, merk: fData.silo2.merk, batches: calculateNewBatches('silo2') },
                    silo3: { akhir: fData.silo3.akhir || fData.silo3.awal, merk: fData.silo3.merk, batches: calculateNewBatches('silo3') },
                    silo4: { akhir: fData.silo4.akhir || fData.silo4.awal, merk: fData.silo4.merk === 'LAINNYA' ? fData.silo4.customMerk : fData.silo4.merk, batches: calculateNewBatches('silo4') },
                    tapioka: { akhir: fData.tapioka.akhir || fData.tapioka.awal, merk: fData.tapioka.merk },
                    gula: { akhir: fData.gula.akhir, merk: fData.gula.merk }
                };
                
                const newLogEntry = { ...fData, id: Date.now(), timestamp: new Date().toISOString() };
                delete newLogEntry.isExisting; 
                
                app.postData({ action: 'saveOpname', payload: { stock: newStockData, log: newLogEntry } }).catch(err => console.error(err));
                
                app.state.stockForm.isExisting = true;
                
                btn.disabled = false; btn.classList.remove('opacity-70', 'cursor-wait');
                document.getElementById('sf-submit-icon').classList.remove('animate-spin');
                app.showSuccessModal('Berhasil!', 'Data opname shift ini telah disimpan.');
                app.renderActiveTab();
            },

                            <div><div class="text-[8px] text-slate-400 font-bold uppercase mb-0.5">Bongkar</div><div class="font-semibold text-slate-700">${formatTime(log.jamBongkar)}</div></div>
                            <div><div class="text-[8px] text-slate-400 font-bold uppercase mb-0.5">Selesai</div><div class="font-semibold text-slate-700">${formatTime(log.jamSelesai)}</div></div>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-center border-t border-slate-100 pt-3">

                            <div class="border-l border-r border-slate-100"><div class="text-[9px] text-slate-400 font-bold uppercase">Akhir</div><div class="font-black text-slate-700">${log.qtyAkhir}</div></div>
                            <div><div class="text-[9px] text-rose-400 font-bold uppercase">Susut</div><div class="font-black text-rose-600">${Number(log.qtyAwal) - Number(log.qtyAkhir)}</div></div>
                        </div>
                        ${log.catatan ? `<div class="mt-3 pt-3 border-t border-slate-100"><p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-1">Catatan</p><p class="text-xs font-semibold text-slate-700 italic">"${log.catatan}"</p></div>` : ''}
                    </div>
                `).join('');

                div.innerHTML = `
                    <div class="bg-[#F4F7F9] w-full max-w-lg rounded-3xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden" onclick="event.stopPropagation()">
                        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-white sticky top-0 z-10">
                            <div>
                                <h3 class="font-black text-slate-800 text-lg flex items-center gap-2"><i data-lucide="truck" class="text-blue-600" style="width: 18px; height: 18px;"></i> Rincian Bulky</h3>
                                <p class="text-[10px] font-bold text-slate-500 mt-0.5">${formatDate(tanggal)} • Shift ${shift}</p>
                            </div>
                            <button type="button" onclick="Handlers.closeOpnameBulkyModal()" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-full transition-colors active:scale-95"><i data-lucide="x" style="width: 18px; height: 18px;"></i></button>
                        </div>
                        <div class="p-4 overflow-y-auto space-y-3">
                            ${contentHtml}
                        </div>
                    </div>
                `;
                document.body.appendChild(div);
                lucide.createIcons({root: div});
            },

            closeOpnameBulkyModal: () => { 
                const el = document.getElementById('opname-bulky-modal');
                if(el) el.remove();
            },

            changeBulkyDay: (val) => { app.state.bulkyFilters.day = val; app.renderActiveTab(); },

            openBulkyModal: (merk) => {
                const recapData = window.currentBulkyRecapData;
                if (!recapData || !recapData[merk]) return;

                let existing = document.getElementById('bulky-detail-modal');
                if (existing) existing.remove();

                const div = document.createElement('div');
                div.id = 'bulky-detail-modal';
                div.className = 'fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-fade-in';
                div.onclick = Handlers.closeBulkyModal;

                div.innerHTML = `
                    <div class="bg-[#F4F7F9] w-full max-w-lg rounded-3xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden" onclick="event.stopPropagation()">
                        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-white sticky top-0 z-10">
                            <h3 class="font-black text-slate-800 text-lg flex items-center gap-2"><i data-lucide="truck" class="text-blue-600" style="width: 18px; height: 18px;"></i> Rincian: ${merk}</h3>
                            <button type="button" onclick="Handlers.closeBulkyModal()" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-full transition-colors active:scale-95"><i data-lucide="x" style="width: 18px; height: 18px;"></i></button>
                        </div>
                        <div class="p-4 overflow-y-auto space-y-3">
                            ${recapData[merk].logs.map(log => `
                                <div class="bg-white border border-slate-200 shadow-sm rounded-2xl p-4">
                                    <div class="flex justify-between items-start mb-3">
                                        <div>
                                            <div class="font-black text-slate-800 text-base">${log.noBulky}</div>
                                            <div class="text-[10px] font-bold text-slate-500">Bongkar: ${formatDate(log.tanggal)} • Shift ${log.shift}</div>
                                            ${log.tanggalKedatangan ? `<div class="text-[10px] font-bold text-blue-500 mt-0.5">Datang: ${formatDate(log.tanggalKedatangan)}</div>` : ''}
                                        </div>
                                        ${Components.Badge(log.tujuanSilo || 'Tidak ada data', 'primary')}
                                    </div>
                                    <div class="grid grid-cols-4 gap-2 text-center text-xs bg-slate-50 rounded-xl p-2 mb-3 border border-slate-100">
                                        <div><div class="text-[8px] text-slate-400 font-bold uppercase mb-0.5">Masuk</div><div class="font-semibold text-slate-700">${formatTime(log.jamMasuk)}</div></div>
                                        <div><div class="text-[8px] text-slate-400 font-bold uppercase mb-0.5">Release</div><div class="font-semibold text-slate-700">${formatTime(log.jamRelease)}</div></div>
                                        <div><div class="text-[8px] text-slate-400 font-bold uppercase mb-0.5">Bongkar</div><div class="font-semibold text-slate-700">${formatTime(log.jamBongkar)}</div></div>
                                        <div><div class="text-[8px] text-slate-400 font-bold uppercase mb-0.5">Selesai</div><div class="font-semibold text-slate-700">${formatTime(log.jamSelesai)}</div></div>
                                    </div>
                                    <div class="grid grid-cols-3 gap-2 text-center border-t border-slate-100 pt-3">
                                        <div><div class="text-[9px] text-slate-400 font-bold uppercase">Awal</div><div class="font-black text-slate-700">${log.qtyAwal} <span class="text-[9px] font-medium opacity-50">kg</span></div></div>
                                        <div class="border-l border-r border-slate-100"><div class="text-[9px] text-slate-400 font-bold uppercase">Akhir</div><div class="font-black text-slate-700">${log.qtyAkhir} <span class="text-[9px] font-medium opacity-50">kg</span></div></div>
                                        <div><div class="text-[9px] text-rose-400 font-bold uppercase">Susut</div><div class="font-black text-rose-600">${Number(log.qtyAwal) - Number(log.qtyAkhir)} <span class="text-[9px] font-medium opacity-50">kg</span></div></div>
                                    </div>
                                    ${log.catatan ? `<div class="mt-3 pt-3 border-t border-slate-100"><p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-1">Catatan</p><p class="text-xs font-semibold text-slate-700 italic">"${log.catatan}"</p></div>` : ''}
                                </div>

                    </div>

                document.body.appendChild(div);
                lucide.createIcons({root: div});
            },

            closeBulkyModal: () => { 
                const el = document.getElementById('bulky-detail-modal');
                if(el) el.remove();
            },
            
            updateBulkyTujuan: (val) => {
                app.state.bulkyForm.tujuanSilo = val;
                const container = document.getElementById('bf-customTujuan-container');
                if (container) {
                    container.className = val === 'LAINNYA / MIX' ? 'block mb-4' : 'hidden mb-4';
                }
            },

            exportBulkyPDF: async () => {
                const logs = app.state.db.bulkyLogs || [];
                const filters = app.state.bulkyFilters;

                let filteredLogs = logs.filter(log => {
                    const logDate = new Date(log.timestamp || log.tanggalKedatangan || log.tanggal);
                    const logWeek = getWeekNumber(logDate).toString();
                    return (filters.week === 'Semua' || filters.week === 'all' || logWeek === filters.week.toString()) && (filters.day === 'all' || getDayName(log.tanggal).toLowerCase() === filters.day.toLowerCase());
                });

                if(filteredLogs.length === 0) { app.showGlobalMessage('Tidak ada data bulky untuk dicetak.', true); return; }
                app.showGlobalMessage('Menyiapkan PDF Bulky...', false);

                const groupedByDate = {};
                filteredLogs.forEach(log => { if(!groupedByDate[log.tanggal]) groupedByDate[log.tanggal] = []; groupedByDate[log.tanggal].push(log); });
                const sortedDates = Object.keys(groupedByDate).sort((a,b) => new Date(b) - new Date(a));

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth(); const pageHeight = pdf.internal.pageSize.getHeight();
                const tempContainer = document.createElement('div');
                tempContainer.style.position = 'absolute'; tempContainer.style.left = '-9999px'; tempContainer.style.top = '0';
                document.body.appendChild(tempContainer);
                let isFirstPage = true;

                for (let i = 0; i < sortedDates.length; i++) {
                    const date = sortedDates[i];
                    const dayLogs = groupedByDate[date].sort((a,b) => parseInt(a.shift) - parseInt(b.shift));

                    const pageDiv = document.createElement('div');
                    pageDiv.style.width = '800px'; pageDiv.style.minHeight = '1131px'; pageDiv.style.backgroundColor = '#ffffff'; pageDiv.style.padding = '40px'; pageDiv.style.boxSizing = 'border-box'; pageDiv.style.fontFamily = 'sans-serif';
                    const filterInfo = `Filter: ${filters.week === 'Semua' || filters.week === 'all' ? 'Semua Minggu' : 'Minggu Ke-'+filters.week} | ${filters.day === 'all' ? 'Semua Hari' : filters.day}`;

                    let html = `
                        <div style="text-align:center; border-bottom: 2px solid #cbd5e1; padding-bottom: 15px; margin-bottom: 20px;">
                            <h1 style="font-size: 24px; font-weight: 900; color: #1e293b; margin: 0 0 5px 0;">Laporan Rekapitulasi Bulky MHS</h1>
                            <p style="font-size: 14px; color: #64748b; margin: 0; font-weight: bold;">Hari/Tanggal: ${getDayName(date)}, ${formatDate(date)}</p>
                            <p style="font-size: 10px; color: #94a3b8; margin-top: 5px;">${filterInfo} (Dicetak: ${new Date().toLocaleString('id-ID')})</p>
                        </div>
                    `;

                    const groupedByShift = {};
                    dayLogs.forEach(log => { if(!groupedByShift[log.shift]) groupedByShift[log.shift] = []; groupedByShift[log.shift].push(log); });

                    Object.keys(groupedByShift).sort().forEach(shift => {
                        html += `
                            <div style="margin-bottom: 20px;">
                                <h3 style="font-size: 16px; font-weight: 800; color: #334155; margin: 0 0 10px 0; background: #f1f5f9; padding: 8px 12px; border-radius: 6px; display: inline-block;">Shift ${shift}</h3>
                                <table style="width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 12px;">
                                    <thead>
                                        <tr style="background: #f8fafc; text-align: left; color: #64748b; font-size: 10px; text-transform: uppercase;">
                                            <th style="padding: 8px; border: 1px solid #e2e8f0; width: 15%;">No Kendaraan</th><th style="padding: 8px; border: 1px solid #e2e8f0; width: 20%;">Merk & Tujuan</th><th style="padding: 8px; border: 1px solid #e2e8f0; text-align: center; width: 35%;">Timeline</th><th style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; width: 10%;">Awal (kg)</th><th style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; width: 10%;">Akhir (kg)</th><th style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; color: #e11d48; width: 10%;">Susut (kg)</th>
                                        </tr>
                                    </thead><tbody>`;
                        groupedByShift[shift].forEach(log => {
                            const susut = (Number(log.qtyAwal) || 0) - (Number(log.qtyAkhir) || 0);
                            html += `
                                        <tr>
                                            <td style="padding: 8px; border: 1px solid #e2e8f0; font-weight: bold; color: #1e293b;">${log.noBulky}</td>
                                            <td style="padding: 8px; border: 1px solid #e2e8f0;"><div style="font-weight:bold; color:#334155;">${log.merk}</div><div style="font-size:10px; color:#3b82f6; text-transform:uppercase; font-weight:bold; margin-top:2px;">${log.tujuanSilo || '-'}</div></td>
                                            <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: center; font-size:10px; color:#64748b; white-space:nowrap;"><span style="display:inline-block; margin-right:4px;">M: <b>${formatTime(log.jamMasuk)}</b></span>|<span style="display:inline-block; margin:0 4px;">R: <b>${formatTime(log.jamRelease)}</b></span>|<span style="display:inline-block; margin:0 4px;">B: <b>${formatTime(log.jamBongkar)}</b></span>|<span style="display:inline-block; margin-left:4px;">S: <b>${formatTime(log.jamSelesai)}</b></span></td>
                                            <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; font-weight: 600;">${log.qtyAwal}</td>
                                            <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; font-weight: 600;">${log.qtyAkhir}</td>
                                            <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: right; font-weight: 900; color: #e11d48;">${susut}</td>
                                        </tr>`;
                            if(log.catatan && log.catatan.trim() !== '') { html += `<tr><td colspan="6" style="padding: 6px 8px; border: 1px solid #e2e8f0; border-top: none; background: #fdfaf3;"><span style="font-size: 9px; color: #94a3b8; text-transform:uppercase; font-weight:bold;">Catatan Tambahan:</span><span style="font-size: 11px; color: #475569; font-style: italic; margin-left: 5px;">"${log.catatan}"</span></td></tr>`; }
                        });
                        html += `</tbody></table></div>`;
                    });
                    pageDiv.innerHTML = html;
                    tempContainer.appendChild(pageDiv);

                    try {
                        const canvas = await html2canvas(pageDiv, { scale: 2, useCORS: true });
                        const imgData = canvas.toDataURL('image/jpeg', 1.0);
                        const imgHeight = (canvas.height * pdfWidth) / canvas.width;
                        let heightLeft = imgHeight; let position = 0;

                        if (!isFirstPage) { pdf.addPage(); }
                        pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeight);
                        heightLeft -= pageHeight; isFirstPage = false;
                        
                        while (heightLeft >= 0) { position = heightLeft - imgHeight; pdf.addPage(); pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeight); heightLeft -= pageHeight; }
                    } catch(err) {}
                    tempContainer.innerHTML = ''; 
                }

                document.body.removeChild(tempContainer);
                pdf.save(`Rekap_Bulky_MHS_${new Date().getTime()}.pdf`);
                app.showSuccessModal('Selesai', 'PDF Bulky berhasil diunduh. (Format Per Hari/Shift)');
            },

            exportBulkyExcel: () => {
                const logs = app.state.db.bulkyLogs || [];
                const filters = app.state.bulkyFilters;
                let filteredLogs = logs.filter(log => {
                    const logWeek = getWeekNumber(new Date(log.timestamp)).toString();
                    return (filters.week === 'Semua' || filters.week === 'all' || logWeek === filters.week.toString()) && (filters.day === 'all' || getDayName(log.tanggal).toLowerCase() === filters.day.toLowerCase());
                }).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                if (filteredLogs.length === 0) { app.showGlobalMessage("Tidak ada data.", true); return; }

                let csv = "Tgl Kedatangan,Tgl Bongkar,Shift,No Bulky,Merk,Tujuan Silo,Jam Masuk,Jam Release,Jam Bongkar,Jam Selesai,Qty Awal,Qty Akhir,Susut,Catatan\n";
                filteredLogs.forEach(log => {
                    csv += `${log.tanggalKedatangan||''},${log.tanggal||''},${log.shift||''},"${log.noBulky||''}","${log.merk||''}",${log.tujuanSilo||''},${formatTime(log.jamMasuk)},${formatTime(log.jamRelease)},${formatTime(log.jamBongkar)},${formatTime(log.jamSelesai)},${log.qtyAwal||0},${log.qtyAkhir||0},${(Number(log.qtyAwal)||0)-(Number(log.qtyAkhir)||0)},"${(log.catatan||'').replace(/"/g, '""')}"\n`;
                });
                const link = document.createElement("a");
                link.setAttribute("href", URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' })));
                link.setAttribute("download", `Rekap_Bulky_MHS_${new Date().getTime()}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            },

            shareBulkyRecap: () => {
                const recapData = window.currentBulkyRecapData || {};
                let msg = `*REKAP BONGKAR BULKY*\nMinggu: ${window.currentBulkyFilters?.week === 'all' || window.currentBulkyFilters?.week === 'Semua' ? 'Semua Minggu' : 'Ke-'+window.currentBulkyFilters?.week}\nHari: ${window.currentBulkyFilters?.day === 'all' ? 'Semua Hari' : window.currentBulkyFilters?.day.charAt(0).toUpperCase() + window.currentBulkyFilters?.day.slice(1)}\n\n`;
                if (Object.keys(recapData).length === 0) msg += `Belum ada data.`;
                else Object.keys(recapData).forEach(merk => { msg += `*${merk}*\n- Total Kendaraan: ${recapData[merk].count}\n- Total Muatan: ${recapData[merk].totalAwal} kg\n- Total Susut: ${recapData[merk].totalSusut} kg\n\n`; });
                window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
            },

            saveBulkyForm: async (e) => {
                e.preventDefault();
                const fData = app.state.bulkyForm;
                if(!fData.noBulky || !fData.merk || !fData.tujuanSilo) return;
                
                const finalTujuanSilo = fData.tujuanSilo === 'LAINNYA / MIX' ? fData.customTujuanSilo : fData.tujuanSilo;
                if(fData.tujuanSilo === 'LAINNYA / MIX' && !finalTujuanSilo) {
                    app.showGlobalMessage('Harap ketik tujuan silo custom.', true); return;
                }
                
                const btn = document.getElementById('bf-submit-btn');
                btn.disabled = true; btn.classList.add('opacity-70', 'cursor-wait');
                document.getElementById('bf-submit-icon').classList.add('animate-spin');
                app.postData({ action: 'saveBulky', payload: { ...fData, tujuanSilo: finalTujuanSilo, id: Date.now(), timestamp: new Date(fData.tanggal).getTime() } }).catch(()=>{});
                app.state.bulkyForm = { ...fData, noBulky: '', merk: '', tujuanSilo: '', customTujuanSilo: '', jamMasuk: '', jamRelease: '', jamBongkar: '', jamSelesai: '', qtyAwal: '', qtyAkhir: '', catatan: '' };
                btn.disabled = false; btn.classList.remove('opacity-70', 'cursor-wait');
                document.getElementById('bf-submit-icon').classList.remove('animate-spin');
                app.showSuccessModal('Berhasil!', 'Data bongkar bulky telah disimpan.');
            },

            saveMaintenanceForm: async (e) => {
                e.preventDefault();
                const btn = document.getElementById('mf-submit-btn');
                btn.disabled = true; btn.classList.add('opacity-70', 'cursor-wait');
                document.getElementById('mf-submit-icon').classList.add('animate-spin');
                app.postData({ action: 'saveMaintenance', payload: { ...app.state.maintenanceForm, id: Date.now(), timestamp: new Date().toISOString() } }).catch(()=>{});
                app.state.maintenanceForm = { ...app.state.maintenanceForm, part: '', kendala: '', perbaikan: '' };
                btn.disabled = false; btn.classList.remove('opacity-70', 'cursor-wait');
                document.getElementById('mf-submit-icon').classList.remove('animate-spin');
                app.showSuccessModal('Berhasil!', 'Laporan kendala mesin telah disimpan.');
            }
        };

        window.onload = () => {
            app.render();
            if (app.state.user) {
                app.fetchData();
            }
        };

    </script>
