<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHS Pro - Smart Operations</title>
    
    <!-- PWA Meta Tags (Ini yang sebelumnya kurang) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0B1B3D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MHS Pro">
    
    <!-- Apple Touch Icon (Sama dengan logo login, format base64 SVG) -->
    <link rel="apple-touch-icon" href="./icon.svg">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #F4F7F9;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-scale-in {
            animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
        
        .ease-spring {
            transition-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .custom-date-input::-webkit-calendar-picker-indicator {
            background: transparent; bottom: 0; color: transparent; cursor: pointer;
            height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        html, body { overflow-x: hidden; }

        /* Fallback for icon sizing */
        .lucide { display: inline-block; }
    </style>
</head>
<body class="font-sans bg-[#F4F7F9] text-slate-800 selection:bg-blue-200">
    
    <!-- Root Container -->
    <div id="root"></div>

    <script>
        // Pendaftaran Service Worker untuk PWA (Ini yang sebelumnya kurang)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('PWA ServiceWorker terdaftar dengan sukses: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('Gagal mendaftar PWA ServiceWorker (pastikan file sw.js dan manifest.json sudah dibuat di root folder): ', err);
                    });
            });
        }

        // === GANTI URL INI DENGAN URL WEB APP GOOGLE SCRIPT ANDA ===
        const API_URL = "https://script.google.com/macros/s/AKfycbxnWOh6-FIn5v_kNalNsIi4QgZoRJ_6htXU_N0AWln2-nUWPTuEuRRwr9mjMCTB6TODdQ/exec";

        // Constants
        const DAYS_OF_WEEK = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
        const SILO_MERK_OPTIONS = {
            soft: ['B7', 'LM', 'MILA', 'FALCONILA', 'B7 MKL', 'LAINNYA'],
            medium: ['W3', 'LAINNYA']
        };

        const getWeekNumber = (date) => {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        };

        const getCurrentShiftInfo = () => {
            const now = new Date();
            const hours = now.getHours();
            let shift = '1';
            let date = new Date(now);

            if (hours >= 7 && hours < 15) {
                shift = '1';
            } else if (hours >= 15 && hours < 23) {
                shift = '2';
            } else {
                shift = '3';
                if (hours < 7) {
                    date.setDate(date.getDate() - 1);
                }
            }
            // Format YYYY-MM-DD
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return { shift, date: `${year}-${month}-${day}` };
        };

        const getDayName = (dateStr) => {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleDateString('id-ID', { weekday: 'long' });
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        };

        const formatDateToYYYYMMDD = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        // Formatter khusus untuk membaca waktu dari Google Sheets (menghindari error ISO string)
        const formatTime = (timeStr) => {
            if (!timeStr || timeStr === '-') return '-';
            if (typeof timeStr === 'string') {
                if (/^\d{2}:\d{2}$/.test(timeStr)) return timeStr;
                if (/^\d{2}:\d{2}:\d{2}/.test(timeStr)) return timeStr.substring(0, 5);
            }
            try {
                const d = new Date(timeStr);
                if (!isNaN(d.getTime())) {
                    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
                }
            } catch (e) {}
            return String(timeStr);
        };

        const calcPakai = (awal, totalMasuk, akhir) => {
            if (akhir === '' || akhir === null || akhir === undefined) return 0;
            const p = (Number(awal) || 0) + (Number(totalMasuk) || 0) - (Number(akhir) || 0);
            return p > 0 ? p : 0;
        };

        // Global App Object for State and Methods
        const app = {
            state: {
                user: null, 
                activeTab: 'dashboard',
                isAuthLoading: false,
                loginError: '',
                globalMessage: null,
                isSyncing: false,
                db: {
                    lastStock: null,
                    opnameLogs: [],
                    bulkyLogs: [],
                    maintenanceLogs: []
                },
                
                // Form States
                stockForm: null,
                recapFilters: { week: 'all', day: 'all', searchOpen: false, searchTxt: '' },
                selectedOpnameForBulky: null, // For viewing bulky details from opname recap
                bulkyFilters: { week: getWeekNumber(new Date()).toString(), day: 'all', searchOpen: false, searchTxt: '' },
                bulkyForm: null,
                maintenanceForm: null,
                selectedMerkRecap: null 
            },

            render: function() {
                const root = document.getElementById('root');
                if (!this.state.user) {
                    root.innerHTML = Components.LoginScreen();
                } else {
                    root.innerHTML = Components.Layout();
                    this.renderActiveTab();
                    this.updateNavIndicator();
                }
                this.renderGlobalMessage();
                lucide.createIcons();
            },

            renderActiveTab: function() {
                const container = document.getElementById('main-content');
                if (!container) return;
                
                let content = '';
                switch (this.state.activeTab) {
                    case 'dashboard': content = Views.Dashboard(); break;
                    case 'stock': content = Views.StockForm(); break;
                    case 'recap': content = Views.OpnameRecap(); break;
                    case 'bulky': content = Views.BulkyForm(); break;
                    case 'maintenance': content = Views.MaintenanceForm(); break;
                }
                container.innerHTML = content;
                lucide.createIcons();
            },

            switchTab: function(tabId) {
                if(this.state.activeTab === tabId) return;
                this.state.activeTab = tabId;
                this.renderActiveTab();
                this.updateNavIndicator();
                
                document.querySelectorAll('.nav-item').forEach(el => {
                    const id = el.dataset.id;
                    const iconContainer = el.querySelector('.icon-container');
                    const label = el.querySelector('.nav-label');
                    const icon = el.querySelector('svg') || el.querySelector('i');
                    
                    if (id === tabId) {
                        iconContainer.className = 'icon-container transition-all duration-300 text-blue-600 transform -translate-y-1 drop-shadow-sm';
                        label.className = 'nav-label text-[9px] sm:text-[10px] mt-1 transition-all duration-300 font-black text-blue-700';
                        if (icon) {
                            icon.style.width = '24px'; icon.style.height = '24px';
                        }
                    } else {
                        iconContainer.className = 'icon-container transition-all duration-300 text-slate-400 group-hover:text-slate-600 group-hover:-translate-y-0.5';
                        label.className = 'nav-label text-[9px] sm:text-[10px] mt-1 transition-all duration-300 font-bold text-slate-400';
                        if (icon) {
                            icon.style.width = '22px'; icon.style.height = '22px';
                        }
                    }
                });
            },

            updateNavIndicator: function() {
                const indicator = document.getElementById('nav-indicator');
                if (!indicator) return;
                
                let tabs = ['dashboard', 'stock', 'recap', 'bulky', 'maintenance'];
                if (this.state.user?.role === 'viewer') {
                    tabs = ['dashboard', 'recap', 'bulky', 'maintenance'];
                }
                const activeIndex = tabs.indexOf(this.state.activeTab);
                const tabWidthPercentage = 100 / tabs.length;
                
                indicator.style.left = `calc(${activeIndex * tabWidthPercentage}% + 8px)`;
                indicator.style.width = `calc(${tabWidthPercentage}% - 16px)`;
            },

            showGlobalMessage: function(msg, isError = true) {
                this.state.globalMessage = { text: msg, isError };
                this.renderGlobalMessage();
                setTimeout(() => {
                    this.state.globalMessage = null;
                    this.renderGlobalMessage();
                }, 3000);
            },

            renderGlobalMessage: function() {
                let existing = document.getElementById('global-message');
                if (existing) existing.remove();
                
                if (this.state.globalMessage) {
                    const msg = this.state.globalMessage;
                    const div = document.createElement('div');
                    div.id = 'global-message';
                    div.className = `fixed top-6 left-1/2 transform -translate-x-1/2 ${msg.isError ? 'bg-rose-900/95 border-rose-700/50 text-white' : 'bg-slate-900/95 border-slate-700/50 text-white'} backdrop-blur-md px-4 py-3 sm:px-6 sm:py-4 rounded-full shadow-2xl text-xs sm:text-sm font-bold flex items-center z-[100] border animate-fade-in`;
                    
                    const iconColor = msg.isError ? 'text-rose-400' : 'text-emerald-400';
                    const iconName = msg.isError ? 'alert-circle' : 'check-circle-2';
                    
                    div.innerHTML = `<i data-lucide="${iconName}" class="mr-2 sm:mr-3 ${iconColor}" style="width: 18px; height: 18px;"></i> ${msg.text}`;
                    document.body.appendChild(div);
                    lucide.createIcons({root: div});
                }
            },

            showSuccessModal: function(title, message) {
                let existing = document.getElementById('success-modal');
                if (existing) existing.remove();

                const div = document.createElement('div');
                div.id = 'success-modal';
                div.className = 'fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm';
                div.innerHTML = `
                    <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl flex flex-col items-center text-center animate-scale-in border border-slate-100">
                        <div class="w-20 h-20 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mb-5 shadow-inner border border-emerald-200">
                            <i data-lucide="check-circle" stroke-width="2.5" style="width: 40px; height: 40px;"></i>
                        </div>
                        <h3 class="text-2xl font-black text-slate-800 mb-2">${title}</h3>
                        <p class="text-sm font-semibold text-slate-500 mb-6">${message}</p>
                        <button onclick="document.getElementById('success-modal').remove()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-white font-black py-4 rounded-2xl transition-colors shadow-lg shadow-emerald-500/30 active:scale-95 text-sm uppercase tracking-widest">
                            Selesai
                        </button>
                    </div>
                `;
                document.body.appendChild(div);
                lucide.createIcons({root: div});
                
                setTimeout(() => {
                    const el = document.getElementById('success-modal');
                    if(el) el.remove();
                }, 3500);
            },

            login: async function(e) {
                e.preventDefault();
                const username = document.getElementById('login-username').value;
                const password = document.getElementById('login-password').value;
                
                this.state.loginError = '';
                if(!API_URL.includes("script.google.com")) {
                    this.state.loginError = "Mohon set API_URL terlebih dahulu di source code.";
                    this.render(); return;
                }
                
                this.state.isAuthLoading = true;
                this.render(); 
                
                try {
                    const res = await fetch(`${API_URL}?action=login&username=${username}&password=${password}`);
                    const data = await res.json();
                    if (data.success) {
                        this.state.user = { username: data.username, role: data.role };
                        this.fetchData();
                        this.render();
                    } else {
                        this.state.loginError = "Login Gagal: Username atau Password salah.";
                    }
                } catch (err) {
                    this.state.loginError = "Koneksi ditolak server (CORS/Network Error). Pastikan API_URL valid & diset ke 'Anyone'.";
                    console.error(err);
                }
                this.state.isAuthLoading = false;
                if(!this.state.user) this.render();
            },

            logout: function() {
                this.state.user = null;
                this.render();
            },

            fetchData: async function() {
                this.state.isSyncing = true;
                this.updateSyncUI(true);
                try {
                    const res = await fetch(`${API_URL}?action=getData`);
                    const data = await res.json();
                    this.state.db = data;
                    if(this.state.activeTab === 'dashboard' || this.state.activeTab === 'recap' || this.state.activeTab === 'maintenance' || this.state.activeTab === 'bulky') {
                         this.renderActiveTab();
                    }
                } catch (err) {
                    console.error("Failed to fetch data", err);
                    this.showGlobalMessage("Gagal sinkronisasi data.");
                }
                this.state.isSyncing = false;
                this.updateSyncUI(false);
            },

            updateSyncUI: function(isSyncing) {
                const btn = document.getElementById('sync-btn');
                const icon = document.getElementById('sync-icon');
                const text = document.getElementById('sync-text');
                if(!btn) return;
                
                if (isSyncing) {
                    btn.disabled = true;
                    btn.classList.add('opacity-70', 'cursor-wait');
                    icon.classList.add('animate-spin');
                    icon.classList.remove('group-hover:rotate-180', 'transition-transform', 'duration-700');
                    if(text) text.innerText = 'Syncing';
                } else {
                    btn.disabled = false;
                    btn.classList.remove('opacity-70', 'cursor-wait');
                    icon.classList.remove('animate-spin');
                    icon.classList.add('group-hover:rotate-180', 'transition-transform', 'duration-700');
                    if(text) text.innerText = 'Sync';
                }
            },

            postData: async function(payloadData) {
                try {
                    // Optimistic update
                    if(payloadData.action === 'saveOpname') {
                        this.state.db.lastStock = { ...this.state.db.lastStock, ...payloadData.payload.stock };
                        this.state.db.opnameLogs = [payloadData.payload.log, ...(this.state.db.opnameLogs || [])];
                    } else if (payloadData.action === 'saveBulky') {
                        this.state.db.bulkyLogs = [payloadData.payload, ...(this.state.db.bulkyLogs || [])];
                        if(this.state.activeTab === 'bulky') this.renderActiveTab();
                    } else if (payloadData.action === 'saveMaintenance') {
                        this.state.db.maintenanceLogs = [payloadData.payload, ...(this.state.db.maintenanceLogs || [])];
                        if(this.state.activeTab === 'maintenance') this.renderActiveTab();
                    }

                    const params = new URLSearchParams();
                    params.append('action', payloadData.action);
                    
                    const flatten = (obj, prefix = '') => {
                        for (const key in obj) {
                            if (Object.prototype.hasOwnProperty.call(obj, key)) {
                                const val = obj[key];
                                const newKey = prefix ? `${prefix}_${key}` : key;
                                
                                if (val !== null && typeof val === 'object') {
                                    if (Array.isArray(val) && (val.length === 0 || typeof val[0] !== 'object')) {
                                        const filteredArray = val.filter(v => v !== null && String(v).trim() !== '');
                                        params.append(newKey, filteredArray.join(' | '));
                                    } else {
                                        flatten(val, newKey);
                                    }
                                } else {
                                    params.append(newKey, val !== undefined && val !== null ? val : '');
                                }
                            }
                        }
                    };
                    
                    if (payloadData.payload) flatten(payloadData.payload);

                    await fetch(API_URL, { method: 'POST', body: params });
                } catch (err) {
                    console.error("Error saving data", err);
                    this.showGlobalMessage("Gagal menyimpan data ke server.");
                }
            }
        };

        const Components = {
            Card: (content, className = '', padding = 'p-5') => {
                const overflowClass = className.includes('overflow-') ? '' : 'overflow-hidden';
                return `<div class="bg-white/90 backdrop-blur-sm rounded-[1.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-200/60 transition-all duration-300 hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] ${overflowClass} ${padding} ${className}">${content}</div>`;
            },
            
            Badge: (content, variant = 'primary') => {
                const variants = {
                    primary: 'bg-blue-50 text-blue-700 border border-blue-100',
                    success: 'bg-emerald-50 text-emerald-700 border border-emerald-100',
                    warning: 'bg-amber-50 text-amber-700 border border-amber-100',
                    danger: 'bg-rose-50 text-rose-700 border border-rose-100',
                    slate: 'bg-slate-100 text-slate-600 border border-slate-200',
                };
                return `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider border ${variants[variant]}">${content}</span>`;
            },

            FloatingInput: (props) => {
                const { id, label, type = 'text', value = '', placeholder = ' ', min, step, suffix, disabled, required, onInput } = props;
                const disabledClasses = disabled ? 'opacity-70 bg-slate-50 cursor-not-allowed text-slate-500 font-semibold' : '';
                const hasValueClass = value ? 'scale-75 -translate-y-3' : '';
                
                return `
                <div class="relative group w-full mb-4">
                    <input
                        type="${type}"
                        id="${id}"
                        ${value ? `value="${value}"` : ''}
                        placeholder="${placeholder}"
                        ${min ? `min="${min}"` : ''}
                        ${step ? `step="${step}"` : ''}
                        ${required ? 'required' : ''}
                        ${disabled ? 'disabled' : ''}
                        ${onInput ? `oninput="${onInput}"` : ''}
                        class="block w-full px-4 pt-6 pb-2 text-base font-medium text-slate-900 bg-white border border-slate-200 rounded-2xl appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all peer shadow-sm ${disabledClasses}"
                    />
                    <label class="absolute text-[11px] font-bold text-slate-400 uppercase tracking-wider duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-3 peer-focus:text-blue-600 ${hasValueClass}">
                        ${label}
                    </label>
                    ${suffix ? `<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none"><span class="text-slate-400 text-xs font-bold">${suffix}</span></div>` : ''}
                </div>`;
            },

            ModernSelect: (props) => {
                const { id, label, value = '', options = [], required, onChange } = props;
                const hasValueClass = value ? 'scale-75 -translate-y-3' : '';
                
                let optionsHtml = `<option value="" disabled ${!value ? 'selected' : ''} class="text-slate-400">Pilih...</option>`;
                options.forEach(opt => {
                    const val = typeof opt === 'object' ? opt.value : opt;
                    const lbl = typeof opt === 'object' ? opt.label : opt;
                    const selected = val === value ? 'selected' : '';
                    optionsHtml += `<option value="${val}" ${selected}>${lbl}</option>`;
                });

                return `
                <div class="relative group w-full mb-4">
                    <select
                        id="${id}"
                        ${required ? 'required' : ''}
                        ${onChange ? `onchange="${onChange}"` : ''}
                        class="block w-full px-4 pt-6 pb-2 text-base font-semibold text-slate-900 bg-white border border-slate-200 rounded-2xl appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all peer shadow-sm"
                    >
                        ${optionsHtml}
                    </select>
                    <label class="absolute text-[11px] font-bold text-slate-400 uppercase tracking-wider duration-300 transform -translate-y-3 scale-75 top-4 z-10 origin-[0] left-4 peer-focus:text-blue-600 ${hasValueClass}">
                        ${label}
                    </label>
                    <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-slate-400">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clipRule="evenodd" fillRule="evenodd"></path></svg>
                    </div>
                </div>`;
            },

            LoginScreen: () => `
                <div class="flex flex-col h-screen bg-[#0B1B3D] justify-center items-center p-4">
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
                    <div class="absolute top-10 right-10 w-64 h-64 bg-blue-500/20 rounded-full mix-blend-screen filter blur-3xl"></div>
                    <div class="absolute bottom-10 left-10 w-64 h-64 bg-indigo-500/20 rounded-full mix-blend-screen filter blur-3xl"></div>
                    
                    <div class="w-full max-w-sm z-10">
                        <div class="text-center mb-10 animate-fade-in">
                            <div class="bg-white/10 w-20 h-20 mx-auto rounded-3xl shadow-inner border border-white/20 backdrop-blur-md flex items-center justify-center mb-4">
                                <i data-lucide="building-2" class="text-white drop-shadow-md" style="width: 40px; height: 40px;"></i>
                            </div>
                            <h1 class="text-4xl font-black tracking-tight leading-none mb-1 text-white flex items-center justify-center">
                                MHS<span class="text-blue-400 font-bold ml-0.5">Pro</span>
                            </h1>
                            <p class="text-[10px] font-bold text-blue-200 uppercase tracking-[0.25em]">Smart Operations</p>
                        </div>

                        <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-6 shadow-2xl animate-fade-in" style="animation-delay: 0.1s">
                            <form onsubmit="app.login(event)">
                                <div class="space-y-4">
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                            <i data-lucide="user-circle" class="text-blue-200" style="width: 20px; height: 20px;"></i>
                                        </div>
                                        <input type="text" id="login-username" required placeholder="Username" class="w-full bg-white/10 text-white placeholder-blue-200/50 font-bold pl-12 pr-4 py-4 rounded-2xl outline-none border border-white/10 focus:border-blue-400 focus:bg-white/20 transition-all"/>
                                    </div>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                            <i data-lucide="key-round" class="text-blue-200" style="width: 20px; height: 20px;"></i>
                                        </div>

                                    <i data-lucide="save" id="mf-submit-icon" class="mr-2" style="width: 16px; height: 16px;"></i>

                    `, 'bg-gradient-to-br from-indigo-600 to-indigo-900 text-white border-none relative overflow-hidden shadow-xl shadow-indigo-900/20', 'p-5 sm:p-6') : ''}

                    <div class="pt-2">

        };

        const Handlers = {
            // Dashboard Handlers
            shareAwal: () => {
                const { shift, date } = getCurrentShiftInfo();
                const hari = getDayName(date);
                const tgl = formatDate(date);
                const s = app.state.db.lastStock;

                let msg = `*INFO STOK AWAL SHIFT*\n`;
                msg += `Hari/Tanggal : ${hari}, ${tgl}\n`;
                msg += `Shift berjalan : ${shift}\n\n`;

                const formatSiloMsg = (name, type, data) => {
                    const currentBatch = data?.batches?.[0];
                    const nextBatch = data?.batches?.[1];
                    let str = `*${name} (${type} - ${data?.merk || '-'})*\nStok Total: ${data?.akhir || 0} kg\n`;
                    if(currentBatch) str += `Gluten Dipakai: ${currentBatch.gluten}% (Sisa: ${currentBatch.qty} kg)\n`;
                    if(nextBatch) str += `Next FIFO: ${nextBatch.gluten}%\n`;
                    return str + `\n`;
                };

                msg += formatSiloMsg('SILO 1', 'Medium', s.silo1);
                msg += formatSiloMsg('SILO 2', 'Soft', s.silo2);
                msg += formatSiloMsg('SILO 3', 'Soft', s.silo3);
                msg += formatSiloMsg('SILO 4', 'Medium', s.silo4);
                
                msg += `*Mini Silo Tapioka (${s.tapioka?.merk || '-'})*: ${s.tapioka?.akhir || 0} kg\n`;
                msg += `*Gula Mesh 30 (${s.gula?.merk || '-'})*: ${s.gula?.akhir || 0} kg\n`;

                window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
            },

            // StockForm Handlers
            updateStockForm: (siloKey, field, value) => {
                const fData = app.state.stockForm;
                fData[siloKey][field] = value;
                
                if (field === 'merk' && (siloKey.startsWith('silo') || siloKey === 'tapioka')) {
                    const customContainer = document.getElementById(`sf-${siloKey}-customMerk-container`);
                    if (customContainer) {
                        customContainer.className = value === 'LAINNYA' ? 'block' : 'hidden sm:block';
                    }
                }

                if (['awal', 'masuk', 'masukZak', 'masukBulky', 'akhir'].includes(field)) {
                    const pemakaianLabel = document.getElementById(`pemakaian-${siloKey}`);
                    if (pemakaianLabel) {
                        let totalMasuk = 0;
                        if(siloKey === 'tapioka') totalMasuk = fData[siloKey].masuk;
                        else totalMasuk = (Number(fData[siloKey].masukZak) || 0) + (Number(fData[siloKey].masukBulky) || 0);

                        pemakaianLabel.innerText = calcPakai(fData[siloKey].awal, totalMasuk, fData[siloKey].akhir);
                    }
                }
            },

            saveStockForm: async (e) => {
                e.preventDefault();
                const fData = app.state.stockForm;
                const db = app.state.db;
                
                // Cek Data Opname Double
                const existingLog = db.opnameLogs?.find(log => log.tanggal === fData.tanggal && log.shift === fData.shift);
                if (existingLog) {
                    app.showGlobalMessage(`Data Opname tanggal ${formatDate(fData.tanggal)} Shift ${fData.shift} sudah pernah disimpan!`, true);
                    return;
                }
                
                const submitBtn = document.getElementById('sf-submit-btn');
                const submitIcon = document.getElementById('sf-submit-icon');
                const submitText = document.getElementById('sf-submit-text');
                
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-70', 'cursor-wait');
                submitIcon.setAttribute('data-lucide', 'refresh-cw');
                submitIcon.classList.add('animate-spin');
                submitText.innerText = 'Menyimpan...';
                lucide.createIcons({root: submitBtn});

                const calculateNewBatches = (siloKey) => {
                    const formInput = fData[siloKey];
                    const prevSilo = db.lastStock[siloKey] || { batches: [] };
                    const awal = Number(formInput.awal) || 0;
                    
                    let totalMasuk = 0;
                    if(siloKey === 'tapioka') totalMasuk = Number(formInput.masuk) || 0;
                    else totalMasuk = (Number(formInput.masukZak) || 0) + (Number(formInput.masukBulky) || 0);

                    const akhir = Number(formInput.akhir) || awal;
                    const pemakaian = Math.max(0, (awal + totalMasuk) - akhir);

                    let currentBatches = [...(prevSilo.batches || [{ qty: awal, gluten: '-' }])];
                    let remainingUsage = pemakaian;

                    while (remainingUsage > 0 && currentBatches.length > 0) {
                        if (currentBatches[0].qty <= remainingUsage) {
                            remainingUsage -= currentBatches[0].qty;
                            currentBatches.shift(); 
                        } else {
                            currentBatches[0].qty -= remainingUsage;
                            remainingUsage = 0;
                        }
                    }

                    if (totalMasuk > 0) {
                        currentBatches.push({ qty: totalMasuk, gluten: formInput.gluten || (currentBatches.length > 0 ? currentBatches[currentBatches.length-1].gluten : '-') });
                    }
                    if (currentBatches.length === 0 && akhir > 0) {
                        currentBatches.push({ qty: akhir, gluten: prevSilo.batches?.[0]?.gluten || '-' });
                    }
                    return currentBatches;
                };

                const newStockData = {
                    silo1: { akhir: fData.silo1.akhir || fData.silo1.awal, merk: fData.silo1.merk === 'LAINNYA' ? fData.silo1.customMerk : fData.silo1.merk, batches: calculateNewBatches('silo1') },
                    silo2: { akhir: fData.silo2.akhir || fData.silo2.awal, merk: fData.silo2.merk, batches: calculateNewBatches('silo2') },
                    silo3: { akhir: fData.silo3.akhir || fData.silo3.awal, merk: fData.silo3.merk, batches: calculateNewBatches('silo3') },
                    silo4: { akhir: fData.silo4.akhir || fData.silo4.awal, merk: fData.silo4.merk === 'LAINNYA' ? fData.silo4.customMerk : fData.silo4.merk, batches: calculateNewBatches('silo4') },
                    tapioka: { akhir: fData.tapioka.akhir || fData.tapioka.awal, merk: fData.tapioka.merk },
                    gula: { akhir: fData.gula.akhir, merk: fData.gula.merk }
                };
                
                const newLogEntry = { ...fData, id: Date.now(), timestamp: new Date().toISOString() };

                app.postData({ action: 'saveOpname', payload: { stock: newStockData, log: newLogEntry } }).catch(err => console.error(err));
                
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70', 'cursor-wait');
                submitIcon.setAttribute('data-lucide', 'save');
                submitIcon.classList.remove('animate-spin');
                submitText.innerText = 'Simpan Opname';
                lucide.createIcons({root: submitBtn});
                
                app.showSuccessModal('Berhasil!', 'Data opname shift ini telah disimpan.');
            },

            shareOpnameWA: () => {
                const d = app.state.stockForm;
                const hari = getDayName(d.tanggal);
                const tgl = formatDate(d.tanggal);
                
                const getMerkStr = (silo) => silo.merk === 'LAINNYA' ? (silo.customMerk || 'Lainnya') : silo.merk;
                
                const getSiloStr = (name, type, data) => {
                    const totalMasuk = (Number(data.masukZak) || 0) + (Number(data.masukBulky) || 0);
                    const pakai = calcPakai(data.awal, totalMasuk, data.akhir);
                    let str = `*${name}* : *Terigu ${type} ${getMerkStr(data)}*\n`;
                    str += `Stock awal : ${data.awal} kg\n`;
                    
                    let arrPemasukan = [];
                    if (data.masukZak) arrPemasukan.push(`Zak: ${data.masukZak}kg`);
                    if (data.masukBulky) arrPemasukan.push(`Bulky: ${data.masukBulky}kg`);
                    let pmsStr = arrPemasukan.length > 0 ? arrPemasukan.join(' | ') : '-';
                    
                    if (totalMasuk > 0 && data.gluten) {
                        str += `Pemasukan : ${pmsStr} (Gluten: ${data.gluten}%)\n`;
                    } else {
                        str += `Pemasukan : ${pmsStr}\n`;
                    }
                    
                    str += `Pemakaian : ${pakai} kg\nStock Akhir : ${data.akhir || data.awal} kg\n`;
                    return str;
                };

                const nextShift = d.shift === '3' ? '1' : String(Number(d.shift) + 1);

                let msg = `*LAPORAN OPNAME & SERAH TERIMA*\nHari : ${hari}, ${tgl}\nShift : ${d.shift}\n\n`;
                msg += getSiloStr('Silo 1', 'medium', d.silo1) + '\n';
                msg += getSiloStr('Silo 2', 'soft', d.silo2) + '\n';
                msg += getSiloStr('Silo 3', 'soft', d.silo3) + '\n';
                msg += getSiloStr('Silo 4', 'medium', d.silo4) + '\n';
                
                const tapiokaPakai = calcPakai(d.tapioka.awal, d.tapioka.masuk, d.tapioka.akhir);
                msg += `*Mini Silo Tapioka (${d.tapioka.merk})*\nAwal : ${d.tapioka.awal} kg | Masuk : ${d.tapioka.masuk || '-'} kg\nPakai: ${tapiokaPakai} kg | Akhir : ${d.tapioka.akhir || d.tapioka.awal} kg\n\n`;
                msg += `*GULA MESH 30 (${d.gula.merk}) : ${d.gula.akhir || '-'} kg*\n\n`;

                if (d.catatanOpname.trim() !== '') msg += `*Catatan Opname:*\n${d.catatanOpname}\n\n`;

                msg += `*Catatan Handover ke Shift ${nextShift}:*\n`;
                const notes = d.serahTerima.filter(n => n.trim() !== '');
                if(notes.length > 0) notes.forEach((catatan, i) => msg += `${i + 1}. ${catatan}\n`);
                else msg += `- Aman / Tidak ada catatan khusus\n`;

                window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
            },

            // Recap Handlers
            openRecapSearch: () => { app.state.recapFilters.searchOpen = true; app.state.recapFilters.searchTxt = ''; app.renderActiveTab(); },
            typeRecapSearch: (val) => { app.state.recapFilters.searchTxt = val; app.renderActiveTab(); setTimeout(()=>document.getElementById('week-search-input').focus(),0); },
            selectRecapWeek: (val) => { app.state.recapFilters.week = val; app.state.recapFilters.searchOpen = false; app.renderActiveTab(); },
            changeRecapDay: (val) => { app.state.recapFilters.day = val; app.renderActiveTab(); },

            exportOpnameExcel: () => {
                const logs = app.state.db.opnameLogs || [];
                const filters = app.state.recapFilters;
                
                let filteredLogs = logs.filter(log => {
                    const logDate = new Date(log.timestamp);
                    const logWeek = getWeekNumber(logDate).toString();
                    const logDayName = getDayName(log.tanggal).toLowerCase();
                    const weekMatches = filters.week === 'all' || logWeek === filters.week.toString();
                    const dayMatches = filters.day === 'all' || logDayName === filters.day.toLowerCase();
                    return weekMatches && dayMatches;
                }).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                if (filteredLogs.length === 0) {
                    app.showGlobalMessage("Tidak ada data untuk di-export.", true);
                    return;
                }

                let csv = "Tanggal,Shift,Silo 1 Merk,S1 Awal,S1 Masuk Zak,S1 Masuk Bulky,S1 Pemakaian,S1 Akhir,Silo 2 Merk,S2 Awal,S2 Masuk Zak,S2 Masuk Bulky,S2 Pemakaian,S2 Akhir,Silo 3 Merk,S3 Awal,S3 Masuk Zak,S3 Masuk Bulky,S3 Pemakaian,S3 Akhir,Silo 4 Merk,S4 Awal,S4 Masuk Zak,S4 Masuk Bulky,S4 Pemakaian,S4 Akhir,Tapioka Merk,Tap Awal,Tap Masuk,Tap Pemakaian,Tap Akhir,Gula Merk,Gula Akhir,Catatan\n";

                filteredLogs.forEach(log => {
                    const calcP = (awal, mZak, mBulky, m, akhir) => calcPakai(awal, (Number(mZak)||0)+(Number(mBulky)||0)+(Number(m)||0), akhir);
                    const row = [
                        log.tanggal,
                        log.shift,
                        log.silo1?.merk || '', log.silo1?.awal || 0, log.silo1?.masukZak || 0, log.silo1?.masukBulky || 0, calcP(log.silo1?.awal, log.silo1?.masukZak, log.silo1?.masukBulky, log.silo1?.masuk, log.silo1?.akhir), log.silo1?.akhir || 0,
                        log.silo2?.merk || '', log.silo2?.awal || 0, log.silo2?.masukZak || 0, log.silo2?.masukBulky || 0, calcP(log.silo2?.awal, log.silo2?.masukZak, log.silo2?.masukBulky, log.silo2?.masuk, log.silo2?.akhir), log.silo2?.akhir || 0,
                        log.silo3?.merk || '', log.silo3?.awal || 0, log.silo3?.masukZak || 0, log.silo3?.masukBulky || 0, calcP(log.silo3?.awal, log.silo3?.masukZak, log.silo3?.masukBulky, log.silo3?.masuk, log.silo3?.akhir), log.silo3?.akhir || 0,
                        log.silo4?.merk || '', log.silo4?.awal || 0, log.silo4?.masukZak || 0, log.silo4?.masukBulky || 0, calcP(log.silo4?.awal, log.silo4?.masukZak, log.silo4?.masukBulky, log.silo4?.masuk, log.silo4?.akhir), log.silo4?.akhir || 0,
                        log.tapioka?.merk || '', log.tapioka?.awal || 0, log.tapioka?.masuk || 0, calcP(log.tapioka?.awal, 0, 0, log.tapioka?.masuk, log.tapioka?.akhir), log.tapioka?.akhir || 0,
                        log.gula?.merk || '', log.gula?.akhir || 0,
                        `"${(log.catatanOpname || '').replace(/"/g, '""')}"`
                    ];
                    csv += row.join(",") + "\n";
                });

                const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `Rekap_Opname_MHS_${new Date().getTime()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            },

            // Opname Bulky Details Handlers
            showOpnameBulky: (tanggal, shift) => {
                app.state.selectedOpnameForBulky = { tanggal, shift };
                app.renderActiveTab();
            },
            closeOpnameBulkyModal: () => {
                app.state.selectedOpnameForBulky = null;
                app.renderActiveTab();
            },

            // Bulky Handlers
            openBulkySearch: () => { app.state.bulkyFilters.searchOpen = true; app.state.bulkyFilters.searchTxt = ''; app.renderActiveTab(); },
            typeBulkySearch: (val) => { app.state.bulkyFilters.searchTxt = val; app.renderActiveTab(); setTimeout(()=>document.getElementById('week-search-bulky').focus(),0); },
            selectBulkyWeek: (val) => { app.state.bulkyFilters.week = val; app.state.bulkyFilters.searchOpen = false; app.renderActiveTab(); },
            changeBulkyDay: (val) => { app.state.bulkyFilters.day = val; app.renderActiveTab(); },
            openBulkyModal: (merk) => { app.state.selectedMerkRecap = merk; app.renderActiveTab(); },
            closeBulkyModal: () => { app.state.selectedMerkRecap = null; app.renderActiveTab(); },
            
            exportBulkyExcel: () => {
                const logs = app.state.db.bulkyLogs || [];
                const filters = app.state.bulkyFilters;
                
                let filteredLogs = logs.filter(log => {
                    const logDate = new Date(log.timestamp);
                    const logWeek = getWeekNumber(logDate).toString();
                    const logDay = getDayName(log.tanggal).toLowerCase();
                    const weekMatches = filters.week === 'all' || logWeek === filters.week.toString();
                    const dayMatches = filters.day === 'all' || logDay === filters.day.toLowerCase();
                    return weekMatches && dayMatches;
                }).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                if (filteredLogs.length === 0) {
                    app.showGlobalMessage("Tidak ada data untuk di-export.", true);
                    return;
                }

                let csv = "Tgl Kedatangan,Tgl Bongkar,Shift,No Bulky,Merk,Tujuan Silo,Jam Masuk,Jam Release,Jam Bongkar,Jam Selesai,Qty Awal,Qty Akhir,Susut,Catatan\n";

                filteredLogs.forEach(log => {
                    const susut = (Number(log.qtyAwal) || 0) - (Number(log.qtyAkhir) || 0);
                    const row = [
                        log.tanggalKedatangan || '',
                        log.tanggal || '',
                        log.shift || '',
                        `"${log.noBulky || ''}"`,
                        `"${log.merk || ''}"`,
                        log.tujuanSilo || '',
                        formatTime(log.jamMasuk) || '',
                        formatTime(log.jamRelease) || '',
                        formatTime(log.jamBongkar) || '',
                        formatTime(log.jamSelesai) || '',
                        log.qtyAwal || 0,
                        log.qtyAkhir || 0,
                        susut,
                        `"${(log.catatan || '').replace(/"/g, '""')}"`
                    ];
                    csv += row.join(",") + "\n";
                });

                const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `Rekap_Bulky_MHS_${new Date().getTime()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            },

            shareBulkyRecap: () => {
                const recapData = window.currentBulkyRecapData || {};
                const filterWeek = window.currentBulkyFilters?.week || 'all';
                const filterDay = window.currentBulkyFilters?.day || 'all';

                let msg = `*REKAP BONGKAR BULKY*\n`;
                msg += `Minggu: ${filterWeek === 'all' ? 'Semua Minggu' : `Ke-${filterWeek}`}\n`;
                msg += `Hari: ${filterDay === 'all' ? 'Semua Hari' : filterDay.charAt(0).toUpperCase() + filterDay.slice(1)}\n`;
                msg += `Tahun: ${new Date().getFullYear()}\n\n`;
                
                if (Object.keys(recapData).length === 0) {
                    msg += `Belum ada data bongkar sesuai filter.`;
                } else {
                    Object.keys(recapData).forEach(merk => {
                        msg += `*${merk}*\n- Total Kendaraan: ${recapData[merk].count}\n- Total Muatan: ${recapData[merk].totalAwal} kg\n- Total Susut: ${recapData[merk].totalSusut} kg\n\n`;
                    });
                }
                window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
            },

            saveBulkyForm: async (e) => {
                e.preventDefault();
                const fData = app.state.bulkyForm;
                if(!fData.noBulky || !fData.merk || !fData.tujuanSilo) return;
                
                const btn = document.getElementById('bf-submit-btn');
                btn.disabled = true;
                btn.classList.add('opacity-70', 'cursor-wait');
                document.getElementById('bf-submit-icon').setAttribute('data-lucide', 'refresh-cw');
                document.getElementById('bf-submit-icon').classList.add('animate-spin');
                document.getElementById('bf-submit-text').innerText = 'Menyimpan...';
                lucide.createIcons({root: btn});

                const newLog = { ...fData, id: Date.now(), timestamp: new Date(fData.tanggal).getTime() };
                
                app.postData({ action: 'saveBulky', payload: newLog }).catch(err => console.error(err));
                
                app.state.bulkyForm = { ...fData, noBulky: '', merk: '', tujuanSilo: '', jamMasuk: '', jamRelease: '', jamBongkar: '', jamSelesai: '', qtyAwal: '', qtyAkhir: '', catatan: '' };
                
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-wait');
                document.getElementById('bf-submit-icon').setAttribute('data-lucide', 'save');
                document.getElementById('bf-submit-icon').classList.remove('animate-spin');
                document.getElementById('bf-submit-text').innerText = 'Simpan Log';
                lucide.createIcons({root: btn});
                
                app.showSuccessModal('Berhasil!', 'Data bongkar bulky telah disimpan.');
            },

            // Maintenance Handlers
            saveMaintenanceForm: async (e) => {
                e.preventDefault();
                const fData = app.state.maintenanceForm;
                
                const btn = document.getElementById('mf-submit-btn');
                btn.disabled = true;
                btn.classList.add('opacity-70', 'cursor-wait');
                document.getElementById('mf-submit-icon').setAttribute('data-lucide', 'refresh-cw');
                document.getElementById('mf-submit-icon').classList.add('animate-spin');
                document.getElementById('mf-submit-text').innerText = 'Menyimpan...';
                lucide.createIcons({root: btn});

                const newLog = { ...fData, id: Date.now(), timestamp: new Date().toISOString() };
                
                app.postData({ action: 'saveMaintenance', payload: newLog }).catch(err => console.error(err));
                
                app.state.maintenanceForm = { ...fData, part: '', kendala: '', perbaikan: '' };
                
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-wait');
                document.getElementById('mf-submit-icon').setAttribute('data-lucide', 'save');
                document.getElementById('mf-submit-icon').classList.remove('animate-spin');
                document.getElementById('mf-submit-text').innerText = 'Simpan Log';
                lucide.createIcons({root: btn});

                app.showSuccessModal('Berhasil!', 'Laporan kendala mesin telah disimpan.');
            },

            shareMaintenance: (log) => {
                const hari = getDayName(log.tanggal);
                const tgl = formatDate(log.tanggal);
                let msg = `*LAPORAN KENDALA MESIN MHS*\n\nHari/Tanggal : ${hari}, ${tgl}\nShift : ${log.shift} (Grup ${log.grup})\n\n`;
                msg += `*⚙️ Part Kendala:*\n${log.part}\n\n*⚠️ Detail Kendala:*\n${log.kendala}\n\n*🔧 Tindakan Perbaikan:*\n${log.perbaikan}\n`;
                window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
            }
        };

        document.addEventListener('click', (e) => {
            if (app.state.recapFilters.searchOpen && !e.target.closest('#week-search-container')) {
                app.state.recapFilters.searchOpen = false;
                if(app.state.activeTab === 'recap') app.renderActiveTab();
            }
            if (app.state.bulkyFilters.searchOpen && !e.target.closest('#week-search-container')) {
                app.state.bulkyFilters.searchOpen = false;
                if(app.state.activeTab === 'bulky') app.renderActiveTab();
            }
        });

        window.onload = () => {
            app.render();
        };

    </script>
</body>
</html>
